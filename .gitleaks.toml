title = "Session Hub gitleaks configuration"
minVersion = "v8.25.0"

# Extend the built-in rules. They already cover cloud keys, GitHub tokens, and private keys.
[extend]
useDefault = true
# Folded into the anthropic-api-key rule below, so that one rule owns the sk-ant- prefix.
disabledRules = ["anthropic-admin-api-key"]

# Replaces the built-in rule of the same id, which misses OAuth tokens (sk-ant-oat01-).
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key, admin key, or OAuth token"
regex = '''sk-ant-(?:api|admin|oat)[0-9]{2}-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

# The hub's own token has no distinctive shape, so match the variable name with a literal value.
# A short placeholder, a shell variable, or a Python expression does not match.
[[rules]]
id = "hub-token"
description = "HUB_TOKEN written as a literal instead of read from the environment"
regex = '''\bHUB_TOKEN["']?\s*[:=]\s*["']?([A-Za-z0-9_+/=-]{16,})'''
entropy = 3.0
keywords = ["hub_token"]

# False positives, each scoped to one rule, one file, and one shape of line.
[[allowlists]]
description = "Content hashes of the design system files; the path tokens.json looks like a key name"
targetRules = ["generic-api-key"]
condition = "AND"
paths = ['''^scripts/design_system\.lock\.json$''']
regexTarget = "line"
regexes = ['''"project/[^"]+":\s*"[0-9a-f]+"''']
