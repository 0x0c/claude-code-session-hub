<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Session Hub</title>
<style>
:root {
  --bg: #f6f7f9; --panel: #ffffff; --ink: #1d2330; --muted: #667085; --line: #e3e6eb; --hover: #f1f3f6;
  --accent: #3b5bdb;
  --s-needs: #d9480f; --s-review: #2b8a3e; --s-fail: #c92a2a; --s-stale: #9c6f00; --s-work: #1971c2;
  --s-wait: #6741d9; --s-block: #862e9c; --s-done: #868e96; --s-queue: #adb5bd;
  --flash: #fff3bf;
  /* Group headings: the same in both themes, dark enough for white text */
  --g-action: #c2410c; --g-active: #1864ab; --g-done: #5c636e;
  --on-fill: #ffffff; --shade: rgb(0 0 0 / .18);
  /* Type: five sizes, two weights */
  --font-sans: system-ui, -apple-system, "Segoe UI", "Hiragino Sans", "Noto Sans JP", sans-serif;
  --fs-title: 16px; --fs-body: 14px; --fs-body-sm: 13px; --fs-meta: 12px; --fs-label: 11px;
  --fw-normal: 400; --fw-strong: 600;
  /* Spacing and corners */
  --space-1: 1px; --space-2: 2px; --space-4: 4px; --space-6: 6px; --space-8: 8px; --space-10: 10px;
  --space-12: 12px; --space-14: 14px; --space-16: 16px; --space-24: 24px;
  --radius-xs: 3px; --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 10px; --radius-pill: 999px;
  --detail-w: min(720px, 55%); /* The open detail panel of the grid layout */
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151b; --panel: #1a1e26; --ink: #e6e8ec; --muted: #98a2b3; --line: #2b313c; --hover: #222833;
    --accent: #748ffc; --s-needs: #ff8a4c; --s-review: #51cf66; --s-fail: #ff6b6b; --s-stale: #fcc419;
    --s-work: #4dabf7; --s-wait: #9775fa; --s-block: #da77f2; --s-done: #868e96; --s-queue: #5c636e;
    --flash: #3d3500; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --panel: #1a1e26; --ink: #e6e8ec; --muted: #98a2b3; --line: #2b313c; --hover: #222833;
  --accent: #748ffc; --s-needs: #ff8a4c; --s-review: #51cf66; --s-fail: #ff6b6b; --s-stale: #fcc419;
  --s-work: #4dabf7; --s-wait: #9775fa; --s-block: #da77f2; --s-done: #868e96; --s-queue: #5c636e;
  --flash: #3d3500; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: var(--fs-body)/1.5 var(--font-sans); }
button, select, input { font: inherit; color: inherit; }
header { position: sticky; top: 0; z-index: 5; background: var(--panel); border-bottom: 1px solid var(--line);
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-8) var(--space-16); padding: var(--space-10) var(--space-16); }
header h1 { font-size: var(--fs-title); margin: 0; }
.conn { display: inline-flex; align-items: center; gap: var(--space-6); font-size: var(--fs-meta); color: var(--muted); }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--s-queue); }
.conn.live .dot { background: var(--s-review); animation: pulse 2s infinite; }
.conn.retry .dot { background: var(--s-stale); }
@keyframes pulse { 50% { opacity: .35; } }
.kpis { display: flex; gap: var(--space-14); font-size: var(--fs-meta); color: var(--muted); margin-left: auto; flex-wrap: wrap; }
.kpis b { color: var(--ink); font-variant-numeric: tabular-nums; }
.iconbtn { background: none; border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-4) var(--space-8); cursor: pointer; font-size: var(--fs-meta); color: inherit; text-decoration: none; }
.iconbtn[aria-pressed="true"], .iconbtn[aria-current="page"] { border-color: var(--accent); color: var(--accent); }
.iconbtn.danger { color: var(--s-fail); border-color: var(--s-fail); margin-left: auto; font-weight: var(--fw-normal); }
.iconbtn.danger:disabled { opacity: .5; cursor: progress; }
main { display: grid; grid-template-columns: minmax(300px, 380px) 1fr; gap: var(--space-16); padding: var(--space-16); max-width: 1500px; margin: 0 auto; }
main { position: relative; }
@media (max-width: 860px) { main { grid-template-columns: 1fr; padding: var(--space-12) var(--space-16); } }
/* Split layout (list layout alone): the page fills the window and each panel scrolls on its own. Keep the query in sync with SPLIT in the JS */
@media screen and (min-width: 860.02px) and (min-height: 480px) {
  body:not(.gridlayout) { height: 100vh; height: 100dvh; display: flex; flex-direction: column; overflow: hidden; }
  body:not(.gridlayout) header { flex: none; }
  body:not(.gridlayout) main { flex: 1; min-height: 0; width: 100%; grid-template-rows: minmax(0, 1fr); column-gap: calc(var(--space-12) + var(--space-16)); }
  body:not(.gridlayout) main > section.panel { display: flex; flex-direction: column; min-height: 0; }
  body:not(.gridlayout) main > section.panel > * { flex: none; }
  body:not(.gridlayout) main > section.panel > .scroll { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
    border-radius: 0 0 calc(var(--radius-xl) - 1px) calc(var(--radius-xl) - 1px); }
  body:not(.gridlayout) #detailScroll { scrollbar-gutter: stable; }
  body:not(.gridlayout) #detailScroll .newbar { top: 8px; }
}
.scroll:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
/* The connector from the selected card to the detail panel */
.linked { border-color: var(--accent) !important; }
#link { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 4; pointer-events: none; overflow: visible; }
#link path { fill: none; stroke: var(--accent); stroke-width: 2; }
#link circle { fill: var(--accent); stroke: var(--panel); stroke-width: 1.5; }
#link.off path { stroke-dasharray: 4 4; }
section.panel { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius-xl); min-width: 0; }
.panel > h2 { font-size: var(--fs-body-sm); margin: 0; padding: var(--space-10) var(--space-14); border-bottom: 1px solid var(--line);
  display: flex; align-items: center; gap: var(--space-8); }
/* Layout toggle */
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; margin-left: auto; }
.seg button { border: 0; background: none; padding: var(--space-2) var(--space-10); cursor: pointer; font-size: var(--fs-meta); font-weight: var(--fw-normal); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-fill); }
.panel > h2 .iconbtn { font-weight: var(--fw-normal); white-space: nowrap; }
.panel > h2 > span:first-child { white-space: nowrap; }
.seg { white-space: nowrap; }
#sessionsTitle { flex-wrap: wrap; }
#tlScope { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
#fullscreenPanel { margin-left: auto; }
.iconbtn.danger:not([hidden]) + #fullscreenPanel { margin-left: 0; }
#fullscreenPanel svg { display: block; width: 12px; height: 12px; margin: var(--space-2) 0; fill: none; stroke: currentColor; stroke-width: 1.5; }
#fullscreenPanel[aria-pressed="true"] .expand, #fullscreenPanel[aria-pressed="false"] .shrink { display: none; }
/* Grid layout: the cards take the full width, and the timeline becomes a panel on the right. The open
   panel takes its width from the cards; a small window has no room for both, so the panel covers it */
main.grid { grid-template-columns: minmax(0, 1fr); max-width: none; }
main.grid.withpanel { padding-right: calc(var(--detail-w) + var(--space-16)); }
@media (max-width: 860px) { main.grid { --detail-w: 100%; } main.grid.withpanel { padding-right: var(--space-16); } }
main.grid #sessions { padding: 0 var(--space-14) var(--space-14); }
main.grid .project { margin: var(--space-12) 0; border: 1px solid var(--line); border-radius: var(--radius-lg); }
main.grid .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(280px, 100%), 1fr)); gap: var(--space-12); }
main.grid .cardwrap { min-width: 0; }
main.grid .card { border: 1px solid var(--line); border-left-width: 3px; border-radius: var(--radius-lg); height: 100%; }
main.grid .card.selected { border-color: var(--accent); }
main.grid #detail { position: fixed; top: var(--header-h, 0px); right: 0; bottom: 0; z-index: 4; width: var(--detail-w);
  overflow-y: auto; overscroll-behavior: contain; border-width: 0 0 0 1px; border-radius: 0; outline: none;
  transform: translateX(100%); visibility: hidden; }
/* Slide when the panel opens or closes, never when the page loads or the layout changes */
main.grid #detail.slide { transition: transform .2s ease-out, visibility .2s; }
main.grid #detail.slide.open { transition: transform .2s ease-out; } /* A hidden panel cannot take focus */
main.grid #detail.open { transform: none; visibility: visible; box-shadow: -8px 0 24px var(--shade); }
main.grid #detail > h2 { position: sticky; top: 0; z-index: 4; background: var(--panel); }
main.grid .newbar { top: 48px; }
@media (prefers-reduced-motion: reduce) { main.grid #detail.slide, main.grid #detail.slide.open { transition: none; } }
/* The handle on the grid panel's left edge. A sibling of #detail, which would scroll a child away */
.resizer { position: relative; width: 10px; cursor: col-resize; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
.resizer::before { content: ""; position: absolute; inset: 0 4px; background: transparent; transition: background-color .15s; }
.resizer::after { content: ""; position: absolute; left: 50%; top: 50%; width: 4px; height: 36px; transform: translate(-50%, -50%);
  border-radius: var(--radius-pill); background: var(--muted); }
.resizer:hover::before, .resizer:focus-visible::before, .resizer.active::before,
.resizer:hover::after, .resizer:focus-visible::after, .resizer.active::after { background: var(--accent); }
main > #panelResize { display: none; position: fixed; z-index: 5; top: var(--header-h, 0px); bottom: 0; right: var(--detail-w); transform: translateX(50%); }
@media (min-width: 860.02px) { main.grid.withpanel:not(.fullscreen) > #panelResize { display: block; } }
@media (pointer: coarse) { .resizer { width: 20px; } .resizer::before { inset: 0 9px; } }
/* Fullscreen: the open panel covers the window, header included, and the page behind it does not scroll.
   The geometry is overridden here, so leaving the mode brings the previous width back */
main.grid.fullscreen #detail { inset: 0; width: auto; z-index: 6; border-width: 0; box-shadow: none; }
html:has(main.fullscreen) { overflow: hidden; }
/* Sessions that need action: a section of its own above the other groups */
.action-section { margin: var(--space-10); border: 1px solid var(--s-needs); border-radius: var(--radius-lg);
  background: color-mix(in srgb, var(--s-needs) 6%, var(--panel)); }
.action-section .project:not(:hover) { background: none; }
main .action-section .project { margin: 0; border: 0; border-radius: calc(var(--radius-lg) - 1px); }
main:not(.grid) .action-section .cardwrap:last-child .card { border-radius: 0 0 calc(var(--radius-lg) - 1px) calc(var(--radius-lg) - 1px); }
main.grid .action-section { margin: var(--space-14) 0 var(--space-4); padding: 0 var(--space-12) var(--space-12); }
main.grid .action-section .card:not(.selected):not(:hover) { background: var(--panel); }
.project { display: flex; align-items: center; gap: var(--space-8); width: 100%; padding: var(--space-8) var(--space-14); border: 0; text-align: left;
  border-top: 1px solid var(--line); background: var(--bg); cursor: pointer; font-size: var(--fs-meta); font-weight: var(--fw-strong); }
.project:hover { background: var(--hover); }
.project.selected { box-shadow: inset 3px 0 var(--accent); }
.project .pname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group-badge { padding: var(--space-1) var(--space-8); border-radius: var(--radius-sm); color: var(--on-fill); background: var(--group-color); }
.project .chev { color: var(--muted); transition: transform .15s; }
.project[aria-expanded="true"] .chev { transform: rotate(90deg); }
/* The status groups inside a project */
main .project.sub { margin: 0; padding: var(--space-6) var(--space-14) var(--space-6) var(--space-24); border-width: 1px 0 0; border-radius: 0; background: none; }
main .project.sub:hover { background: var(--hover); }
main.grid .project.sub { border: 0; border-radius: var(--radius-lg); }
main.grid .subcards { padding: var(--space-4) 0 var(--space-8) var(--space-24); }
.project .count { color: var(--muted); font-weight: var(--fw-normal); font-variant-numeric: tabular-nums; }
.card { padding: var(--space-10) var(--space-14); border-top: 1px solid var(--line); cursor: pointer; border-left: 3px solid transparent; }
.cardwrap:hover .card { background: var(--hover); }
.card.selected { background: var(--hover); border-left-color: var(--accent); }
.cardwrap { position: relative; }
.card.archived .title { font-weight: var(--fw-normal); color: var(--muted); }
.card .row1 { display: flex; align-items: center; gap: var(--space-8); min-width: 0; }
.card .title { font-weight: var(--fw-strong); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; min-width: 0; }
.card .meta { font-size: var(--fs-meta); color: var(--muted); display: flex; gap: var(--space-10); flex-wrap: wrap; margin-top: var(--space-2); }
a.pr { color: var(--accent); }
#tlDesktop { flex: none; }
@media (max-width: 860px) { #tlTitle { flex-wrap: wrap; } } /* The link and the buttons do not fit one line */
#tlPr { flex: none; font-weight: var(--fw-normal); white-space: nowrap; }
.card .summary { font-size: var(--fs-body-sm); margin-top: var(--space-4); overflow-wrap: anywhere; }
.spinner { width: 14px; height: 14px; flex: none; border-radius: 50%; border: 2px solid var(--line);
  border-top-color: var(--s-work); animation: spin .9s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }
.badge { font-size: var(--fs-label); font-weight: var(--fw-strong); padding: var(--space-1) var(--space-8); border-radius: var(--radius-pill); color: var(--on-fill); white-space: nowrap; }
.badge.plain { padding-inline: 0; font-weight: var(--fw-normal); color: var(--muted); }
/* A question mark that explains the label before it */
.help { display: inline-flex; flex: none; align-items: center; justify-content: center; width: 14px; height: 14px; border: 1px solid var(--muted);
  border-radius: 50%; color: var(--muted); font-size: var(--fs-label); font-weight: var(--fw-normal); line-height: 1; cursor: help; }
.help:hover { color: var(--accent); }
.group-badge + .help { margin-left: var(--space-6); }
.chip { font-size: var(--fs-label); padding: 0 var(--space-6); border-radius: var(--radius-sm); border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
.progress { height: 5px; background: var(--line); border-radius: var(--radius-xs); overflow: hidden; margin-top: var(--space-6); }
.progress > i { display: block; height: 100%; background: var(--s-work); }
.ask { margin-top: var(--space-6); padding: var(--space-6) var(--space-8); border-radius: var(--radius-md); border: 1px solid var(--s-needs); font-size: var(--fs-body-sm); overflow-wrap: anywhere; }
.ask .opts { display: flex; gap: var(--space-4); flex-wrap: wrap; margin-top: var(--space-4); }
.ask .opt { font-size: var(--fs-meta); border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 0 var(--space-6); }
.ask .opt.def { border-color: var(--s-needs); font-weight: var(--fw-strong); }
.empty { padding: var(--space-24) var(--space-14); color: var(--muted); text-align: center; font-size: var(--fs-body-sm); }
.toolbar { display: flex; flex-wrap: wrap; gap: var(--space-8); padding: var(--space-10) var(--space-14); border-bottom: 1px solid var(--line); align-items: center; }
.toolbar input[type=search] { flex: 1; min-width: 140px; padding: var(--space-4) var(--space-8); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); }
.toolbar select { padding: var(--space-4) var(--space-6); border: 1px solid var(--line); border-radius: var(--radius-md); background: var(--bg); max-width: 100%; }
.toolbar label { font-size: var(--fs-meta); color: var(--muted); display: inline-flex; align-items: center; gap: var(--space-4); }
.tabs { display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius-md); overflow: hidden; }
.tabs button { border: 0; background: none; padding: var(--space-4) var(--space-10); cursor: pointer; font-size: var(--fs-meta); }
.tabs button[aria-selected="true"] { background: var(--accent); color: var(--on-fill); }
.types { display: flex; gap: var(--space-4); flex-wrap: wrap; padding: var(--space-8) var(--space-14); border-bottom: 1px solid var(--line); }
.types button { font-size: var(--fs-label); border: 1px solid var(--line); border-radius: var(--radius-pill); background: none; padding: var(--space-1) var(--space-8); cursor: pointer; color: var(--muted); }
.types button[aria-pressed="true"] { color: var(--ink); border-color: var(--ink); }
.newbar { display: none; position: sticky; top: 56px; z-index: 3; margin: var(--space-8) auto 0; width: max-content;
  background: var(--accent); color: var(--on-fill); border: 0; border-radius: var(--radius-pill); padding: var(--space-4) var(--space-14); cursor: pointer; font-size: var(--fs-meta); }
.newbar.show { display: block; }
.feed { padding: var(--space-4) 0 var(--space-12); }
.day { font-size: var(--fs-label); font-weight: var(--fw-strong); color: var(--muted); padding: var(--space-10) var(--space-14) var(--space-2); }
.ev { display: grid; grid-template-columns: 56px 14px 1fr; gap: 0 var(--space-10); padding: var(--space-6) var(--space-14); align-items: start; }
.ev:hover { background: var(--hover); }
.ev.flash { animation: flash 2.5s ease-out; }
@keyframes flash { from { background: var(--flash); } to { background: transparent; } }
/* Glow on message receipt. --glow is the color of the new state; keep the duration in sync with GLOW_MS in the JS */
.glow { --glow: var(--accent); animation: glow var(--glow-ms, 6s) ease-in-out both; position: relative; z-index: 1; border-radius: var(--radius-lg); }
/* Breathe: three bright peaks, each falling back to a faint halo, then fade out. The halo itself pulses;
   a constant outline would read as a static highlight. */
@keyframes glow {
  0%, 30%, 60% { box-shadow: 0 0 0 1.5px var(--glow), 0 0 14px 4px color-mix(in srgb, var(--glow) 75%, transparent),
    0 0 36px 12px color-mix(in srgb, var(--glow) 45%, transparent), inset 0 0 22px color-mix(in srgb, var(--glow) 30%, transparent); }
  15%, 45%, 75% { box-shadow: 0 0 0 1px color-mix(in srgb, var(--glow) 30%, transparent), 0 0 6px 1px color-mix(in srgb, var(--glow) 25%, transparent),
    0 0 12px 2px color-mix(in srgb, var(--glow) 12%, transparent), inset 0 0 8px color-mix(in srgb, var(--glow) 8%, transparent); }
  100% { box-shadow: 0 0 0 0 transparent, 0 0 0 0 transparent, 0 0 0 0 transparent, inset 0 0 0 transparent; }
}
.lanes .laneglow { animation: laneglow var(--glow-ms, 6s) ease-in-out both; pointer-events: none; }
@keyframes laneglow { 0%, 30%, 60% { opacity: .45; } 15%, 45%, 75% { opacity: .12; } 100% { opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  @keyframes laneglow { 0%, 30% { opacity: .35; } 100% { opacity: 0; } }
  @keyframes glow { 0%, 75% { box-shadow: 0 0 0 2px var(--glow); } 100% { box-shadow: 0 0 0 0 transparent; } }
}
.ev time { font-size: var(--fs-meta); color: var(--muted); font-variant-numeric: tabular-nums; padding-top: var(--space-1); }
.ev .mark { width: 10px; height: 10px; border-radius: 50%; margin-top: var(--space-4); border: 2px solid var(--panel); outline: 1px solid var(--line); }
.ev .body { min-width: 0; }
.ev .head { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-6); }
.ev .who { font-size: var(--fs-meta); font-weight: var(--fw-strong); cursor: pointer; }
.ev .type { font-size: var(--fs-label); color: var(--muted); }
.ev .text { font-size: var(--fs-body-sm); overflow-wrap: anywhere; margin-top: var(--space-1); }
.ev .changes { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-4); }
.ev details { margin-top: var(--space-4); }
.ev summary { font-size: var(--fs-label); color: var(--muted); cursor: pointer; }
.ev pre { font-size: var(--fs-label); background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius-md); padding: var(--space-8); overflow-x: auto; margin: var(--space-4) 0 0; }
.hb { font-size: var(--fs-label); color: var(--muted); padding: var(--space-2) var(--space-14) var(--space-2) calc(var(--space-14) + 56px + var(--space-10) + 14px); }
.lanebar { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: center; padding: var(--space-10) var(--space-14) 0; font-size: var(--fs-meta); color: var(--muted); }
.lanebar button:disabled { opacity: .5; cursor: default; }
.lanebar .range { font-variant-numeric: tabular-nums; }
.lanes { padding: var(--space-10) var(--space-14) var(--space-14); overflow-x: auto; touch-action: pan-y; user-select: none; -webkit-user-select: none; }
.lanes.zoomed { cursor: grab; }
.lanes.dragging, .lanes.dragging * { cursor: grabbing; }
.lanes .cursor { stroke: var(--accent); stroke-width: 1.5; pointer-events: none; }
.lanes svg { display: block; }
.lanes text { fill: var(--muted); font-size: var(--fs-label); }
.lanes .lname { fill: var(--ink); font-size: var(--fs-meta); cursor: pointer; }
.lanes .grid { stroke: var(--line); }
.lanes .evdot { cursor: pointer; stroke: var(--panel); stroke-width: 1.5; }
.overview { padding: var(--space-10) var(--space-14) var(--space-14); }
.ovaxis, .ovrow { display: grid; grid-template-columns: minmax(80px, 160px) 1fr; column-gap: var(--space-8); align-items: center; }
.ovaxis { font-size: var(--fs-label); color: var(--muted); }
.ovticks { position: relative; height: 16px; }
.ovticks span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.ovticks span:first-child { transform: none; }
.ovticks span:last-child { transform: translateX(-100%); }
.ovrow { padding: var(--space-2) 0; }
.ovrow.sel { background: var(--hover); border-radius: var(--radius-md); }
.ovname { border: 0; background: none; padding: 0; text-align: left; cursor: pointer; color: var(--ink); font-size: var(--fs-meta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ovtrack { position: relative; height: 14px; background-image: linear-gradient(var(--line), var(--line)); background-size: 100% 1px; background-position: center; background-repeat: no-repeat; }
.ovseg { position: absolute; top: 0; bottom: 0; min-width: 3px; border-radius: var(--radius-xs); opacity: .85; }
.legend { display: flex; flex-wrap: wrap; gap: var(--space-10); padding: 0 var(--space-14) var(--space-12); font-size: var(--fs-label); color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: var(--space-4); }
.legend i { width: 10px; height: 10px; border-radius: var(--radius-xs); display: inline-block; }
.colbar { display: flex; flex-wrap: wrap; gap: var(--space-6); align-items: center; padding: var(--space-8) var(--space-14); border-bottom: 1px solid var(--line); font-size: var(--fs-meta); color: var(--muted); }
.colbar .desc { flex: 1 1 100%; }
.kgroup { padding: var(--space-4) var(--space-14) var(--space-10); }
.kgroup h3 { font-size: var(--fs-meta); margin: var(--space-10) 0 var(--space-6); color: var(--muted); display: flex; gap: var(--space-6); align-items: center; }
.kgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: var(--space-10); align-items: start; }
.kcard { border: 1px solid var(--line); border-left: 4px solid var(--kc, var(--s-queue)); border-radius: var(--radius-lg); padding: var(--space-8) var(--space-10); background: var(--panel); min-width: 0; }
.kcard.obsolete { opacity: .55; }
.kcard.flash { animation: flash 2.5s ease-out; }
.kcard .ktitle { font-weight: var(--fw-strong); font-size: var(--fs-body-sm); overflow-wrap: anywhere; }
.kcard .kbody { font-size: var(--fs-body-sm); white-space: pre-wrap; overflow-wrap: anywhere; margin-top: var(--space-4); }
.kcard .kmeta { display: flex; flex-wrap: wrap; gap: var(--space-4); margin-top: var(--space-6); font-size: var(--fs-label); color: var(--muted); align-items: center; }
.kcard .src { cursor: pointer; text-decoration: underline dotted; }
table.ctable { width: 100%; border-collapse: collapse; font-size: var(--fs-body-sm); }
.ctable-wrap { overflow-x: auto; padding: var(--space-4) var(--space-14) var(--space-12); }
table.ctable tbody tr:hover { background: var(--hover); }
table.ctable .nowrap { white-space: nowrap; font-variant-numeric: tabular-nums; }
table.ctable .wide { min-width: 120px; }
table.ctable tr.before { color: var(--muted); }
table.ctable .linkbtn { background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline dotted; font-variant-numeric: tabular-nums; }
table.ctable th, table.ctable td { text-align: left; padding: var(--space-6) var(--space-8); border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: anywhere; }
table.ctable th { font-size: var(--fs-label); color: var(--muted); font-weight: var(--fw-strong); }
.tip { position: fixed; z-index: 10; pointer-events: none; background: var(--ink); color: var(--panel); font-size: var(--fs-meta);
  padding: var(--space-6) var(--space-8); border-radius: var(--radius-md); max-width: 320px; display: none; }

      "help.state.archived": "片付けたセッションです。対応は不要です。",
      "guide.title": "ステータスの説明",
      "guide.intro": "ダッシュボードは、すべてのセッションを4つのステータスに分けます。各セッションには、何をしているか、何を待っているかを示す状態も表示します。",

      "guide.col.id": "識別子",
      "guide.col.meaning": "意味",
    },
  };
  const LANGS = Object.keys(MESSAGES);
  function initialLang() {
    const q = new URLSearchParams(location.search).get("lang");
    if (LANGS.includes(q)) return q;
    try { const saved = localStorage.getItem("hub.lang"); if (LANGS.includes(saved)) return saved; } catch (_) {}

  let LOCALE = LANG === "ja" ? "ja-JP" : "en-US";
  function t(key, params = {}) {
    // A "<key>_one" message, when the language has one, covers a count of exactly one.
    if (params.n === 1 && MESSAGES[LANG][key + "_one"]) key += "_one";
    const text = (MESSAGES[LANG] && MESSAGES[LANG][key]) ?? MESSAGES.en[key] ?? key;
    return text.replace(/\{(\w+)\}/g, (_, k) => String(params[k] ?? ""));
  }
  // A display string from the server is either plain or a {"en": ..., "ja": ...} map.
  const L = (v) => (v && typeof v === "object" ? (v[LANG] ?? v.en ?? Object.values(v)[0]) : v);
  // The review gate's unmet conditions arrive as codes; older snapshots carry preformatted text.

    return s.gate_codes.map((g) => {

      if (g.code === "ci" && v === "unknown") v = t("ci.unknown");

  const STATE_COLORS = {
    needs_human: "--s-needs", review_ready: "--s-review", review_pending: "--s-wait", failed: "--s-fail",
    stale: "--s-stale", working: "--s-work", planning: "--s-work", waiting_ci: "--s-wait", blocked: "--s-block",
    in_review: "--s-wait", changes_requested: "--s-needs", done: "--s-done", abandoned: "--s-done",
    queued: "--s-queue", archived: "--s-queue",
  };
  // The states that each status (group heading) holds, in the order of the status guide
  const STATUS_STATES = {
    action: ["needs_human", "review_ready", "failed", "stale"],
    active: ["queued", "planning", "working", "waiting_ci", "blocked", "review_pending", "in_review", "changes_requested"],
    done: ["done", "abandoned"],
    archived: ["archived"],
  };
  const TYPE_KEYS = ["start", "report", "ask", "answer", "command", "ready", "pr", "done", "fail", "finding", "archive", "unarchive", "heartbeat"];
  let STATE, TYPES;
  function buildLabels() {
    STATE = Object.fromEntries(Object.entries(STATE_COLORS).map(([k, c]) => [k, [t("state." + k), c]]));
    TYPES = Object.fromEntries(TYPE_KEYS.map((k) => [k, t("type." + k)]));
  }
  buildLabels();
  const ESCALATE = new Set(["needs_human", "review_ready", "failed", "done"]);

  // ---- Glow on message receipt ----
  // When an update (message) arrives from a sub-session, the related elements glow for GLOW_MS.
  // If a re-render rebuilds the DOM, a negative animation-delay equal to the elapsed time resumes the glow mid-way.
  const GLOW_MS = 6000;
  document.documentElement.style.setProperty("--glow-ms", GLOW_MS + "ms");
  const glows = new Map(); // key -> { start, color }
  const glowKey = { session: (sid) => "s:" + sid, event: (id) => "e:" + id };
  function markGlow(key, color) { glows.set(key, { start: performance.now(), color }); }

  }

    colGroups: {}, showObsolete: false,

    fullscreen: false, // only while the grid's panel is open; applyLayout clears it otherwise
  };
  const prevStates = new Map();
  try { ui.byProject = localStorage.getItem("hub.byProject") !== "0"; } catch (_) {}
  try { ui.collapsed = new Set(JSON.parse(localStorage.getItem("hub.collapsed") || "[]")); } catch (_) {}

  const stateKey = (s) => (s.archived ? "archived" : s.stale ? "stale" : s.state === "review_ready" && s.gate && s.gate.length ? "review_pending" : s.state);

    if (s < 86400) return t("ago.hour", { n: Math.floor(s / 3600) });

  const sessionName = (sid) => {
    const s = db.sessions.find((x) => x.session_id === sid);

  // ---- Session list ----
  // Most recently updated first, by the same timestamp that the card shows
  const byRecent = (a, b) => (a.heartbeat > b.heartbeat ? -1 : a.heartbeat < b.heartbeat ? 1 : 0);

  // Sessions by project, in the order of each project's first session in the given list; sessions
  // without a project come last.
  function projectGroups(sessions) {
    const groups = new Map();
    for (const s of sessions) {
      const key = s.repo || "";

      groups.get(key).push(s);
    }

  }

  const statusOf = (s) => (s.archived ? "archived" : s.needs_action ? "action" : ["done", "abandoned"].includes(s.state) ? "done" : "active");
  // The prefix keeps a status key apart from a project of the same name
  const ACTION_KEY = "status:action";

  }

  function groupHeader(key, label, list, parent = null) {

      el("span", { class: "chev", "aria-hidden": "true" }, "▸"),

  // Rebuilding the list destroys the focused control, so put the focus back on the card of

  function renderSessions() {

  function sessionCard(s, inProject) {

      pr.number || prUrl ? el("span", {}, prLabel(pr), (pr.ci ? ` CI:${pr.ci}` : "") + (pr.unresolved_threads != null ? t("card.threads", { n: pr.unresolved_threads }) : "")) : null,

      el("div", { class: "meta" }, meta),
      s.summary ? el("div", { class: "summary" }, s.summary) : null,
      p.total && s.state !== "done" ? el("div", { class: "progress", "aria-hidden": "true" }, el("i", { style: { width: pct + "%" } })) : null,
    );

        el("div", {}, el("b", {}, `Q${a.qid} ${a.kind}${a.blocking ? t("ask.blocking") : t("ask.nonblocking")}: `), a.question || ""),
        a.options && a.options.length
          ? el("div", { class: "opts" }, a.options.map((o) => el("span", { class: "opt" + (o === a.default ? " def" : "") }, o)))

        el("div", { class: "meta" }, t("ask.answer", { sid: s.session_id, q: a.qid }))));

  // ---- Timeline (feed) ----
  function filteredEvents() {
    const q = ui.text.toLowerCase();
    const out = [];
    for (const e of db.events.values()) {
      if (ui.session && e.session_id !== ui.session) continue;
      if (e.type === "heartbeat" ? !ui.heartbeat : !ui.types.has(e.type)) continue;
      if (q && !eventText(e).toLowerCase().includes(q) && !sessionName(e.session_id).toLowerCase().includes(q)) continue;
      out.push(e);
    }
    out.sort((a, b) => (a.ts < b.ts ? -1 : a.ts > b.ts ? 1 : a.id < b.id ? -1 : 1));
    if (!ui.asc) out.reverse();
    return out;
  }

  function eventText(e) {
    if (e.type === "ask") return (e.attention && e.attention.question) || "";
    if (e.type === "answer") return `Q${e.qid} → ${e.value}`;
    if (e.type === "fail") return e.last_error || e.summary || "";
    if (e.type === "pr") {
      const p = e.pr || {};
      return [p.number && `PR#${p.number}`, p.ci && `CI:${p.ci}`, p.unresolved_threads != null && t("card.threads", { n: p.unresolved_threads }).trim(), p.review].filter(Boolean).join(" ");
    }
    if (e.type === "finding") {
      const f = e.finding || {};
      return `${f.title || ""}` + (f.status === "obsolete" ? t("ev.obsolete") : "");
    }
    if (e.type === "heartbeat") {
      const u = e.usage || {};
      return `in ${fmtNum(u.input)} / out ${fmtNum(u.output)}` + (u.context_pct != null ? ` ctx ${u.context_pct}%` : "");
    }
    return [e.summary, e.next && t("ev.next", { v: e.next }), e.note].filter(Boolean).join(" / ");
  }

  // A PR/CI event links its number, with the session's URL when the event names the same pull request
  function eventBody(e) {
    const text = eventText(e);
    if (e.type !== "pr") return text;
    const p = e.pr || {};
    const s = db.sessions.find((x) => x.session_id === e.session_id);
    const known = (s && s.pr) || {};
    const pr = { number: p.number, url: p.url || (p.number && p.number === known.number ? known.url : null) };
    if (!prWebUrl(pr)) return text;
    const name = prName(pr);
    return [prLabel(pr), p.number ? text.slice(name.length) : text && ` ${text}`];
  }

  function changeChips(e) {
    const d = e.diff || {};
    const chips = [];
    if (d.state) chips.push(el("span", { class: "chip" }, `${(STATE[d.state.from] || [d.state.from])[0]} → `, badge(d.state.to)));
    if (d.phase) chips.push(el("span", { class: "chip" }, t("chip.phase", { from: d.phase.from || "-", to: d.phase.to || "-" })));
    if (d.progress) {
      const f = d.progress.from || {}, to = d.progress.to || {};
      chips.push(el("span", { class: "chip" }, t("chip.tasks", { a: `${f.done ?? 0}/${f.total ?? 0}`, b: `${to.done}/${to.total}` })));
    }
    if (d.attention && d.attention.to == null && d.attention.from) chips.push(el("span", { class: "chip" }, t("chip.resolved", { q: d.attention.from.qid })));
    if (d.ready) chips.push(el("span", { class: "chip" }, t("chip.ready")));
    if (d.confidence) chips.push(el("span", { class: "chip" }, t("chip.confidence", { v: d.confidence.to })));
    return chips;
  }

  function renderFeed() {
    const box = $("feedView");
    const events = filteredEvents();
    box.replaceChildren();
    if (!events.length) { box.append(el("div", { class: "empty" }, t("events.empty"))); return; }
    let lastDay = null;
    let hbRun = [];
    const flushHb = () => {
      // Even when heartbeats are shown, collapse consecutive ones into one line
      if (!hbRun.length) return;
      if (hbRun.length === 1) box.append(eventRow(hbRun[0]));
      else box.append(el("div", { class: "hb" }, `heartbeat ×${hbRun.length}（${hhmm(hbRun[hbRun.length - 1].ts)}〜${hhmm(hbRun[0].ts)}）`));
      hbRun = [];
    };
    for (const e of events) {
      const d = dayOf(e.ts);
      if (d !== lastDay) { flushHb(); box.append(el("div", { class: "day" }, d)); lastDay = d; }
      if (e.type === "heartbeat" && !Object.keys(e.diff || {}).length) { hbRun.push(e); continue; }
      flushHb();
      box.append(eventRow(e));
    }
    flushHb();
  }

  function eventRow(e) {
    const body = eventBody(e);
    const color = e.state_after ? `var(${(STATE[e.state_after] || [0, "--s-queue"])[1]})` : "var(--s-queue)";
    const who = e.writer ? `${e.writer} → ` : "";
    const row = el("div", glowProps([glowKey.event(e.id)], { class: "ev", id: "ev-" + e.id }),
      el("time", { datetime: e.ts, title: e.ts }, hhmm(e.ts)),
      el("span", { class: "mark", style: { background: color } }),
      el("div", { class: "body" },
        el("div", { class: "head" },
          el("span", { class: "who", style: { color: laneColor(e.session_id) }, title: e.session_id,
                       onclick: () => selectSession(e.session_id) }, who + sessionName(e.session_id)),
          el("span", { class: "type" }, TYPES[e.type] || e.type),
          e.phase && !(e.diff || {}).phase ? el("span", { class: "chip" }, e.phase) : null),
        body ? el("div", { class: "text" }, body) : null,
        e.type === "ask" && e.attention && e.attention.options && e.attention.options.length
          ? el("div", { class: "changes" }, e.attention.options.map((o) => el("span", { class: "chip" }, o + (o === e.attention.default ? t("opt.default") : ""))))
          : null,
        el("div", { class: "changes" }, changeChips(e)),
