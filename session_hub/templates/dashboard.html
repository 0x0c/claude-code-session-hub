    return row;
  }
  const stripEvent = (e) => { const { state_after, ...rest } = e; return rest; };

  // ---- Timeline (overview) ----
  // One thin band per session over the whole history, so that every session's lifespan fits one screen
  function renderOverview() {
    const box = $("overview"), legend = $("ovLegend");
    tipEl.style.display = "none"; // the element under the pointer is about to be replaced
    const all = [...db.events.values()];
    legend.hidden = !db.sessions.length || !all.length;
    if (legend.hidden) { box.replaceChildren(el("div", { class: "empty" }, t("lanes.empty"))); return; }
    let t0 = Infinity, t1 = Date.now();
    for (const e of all) { const at = Date.parse(e.ts); t0 = Math.min(t0, at); t1 = Math.max(t1, at); }
    const full = Math.max(1, t1 - t0);
    const pct = (ts) => ((ts - t0) / full) * 100;
    const bySession = new Map(db.sessions.map((s) => [s.session_id, []]));
    for (const e of all) bySession.get(e.session_id)?.push(e);
    // Labels on the smallest step whose labels do not touch, at most six between the start and "now"
    const trackW = Math.max(100, ((box.clientWidth || 560) - 28) - 168); // the widest name column
    const room = (full > 86400000 ? 84 : 52) / trackW * full; // the time that one label covers
    const step = LANE_STEPS.find((n) => n >= Math.max(full / 6, room)) || Math.ceil(Math.max(full / 6, room) / 2592e6) * 2592e6;
    const label = (ts) => (full > 86400000 ? `${new Date(ts).getMonth() + 1}/${new Date(ts).getDate()} ` : "") + hhmm(ts);
    const ticks = [el("span", { style: { left: "0%" } }, label(t0))];
    const offset = new Date(t1).getTimezoneOffset() * 60000; // round local times, not round UTC times
    for (let at = Math.ceil((t0 - offset) / step) * step + offset; at < t1 - room * 1.2; at += step) if (at > t0 + room * 1.6) ticks.push(el("span", { style: { left: pct(at) + "%" } }, label(at)));
    ticks.push(el("span", { style: { left: "100%" } }, t("overview.end")));
    const rows = db.sessions.map((s) => {
      const name = s.title || s.session_id;
      const evs = bySession.get(s.session_id).sort((a, b) => (a.ts < b.ts ? -1 : 1));
      const segs = laneSegments(s, evs, t1).map((g) => {
        const seg = el("i", { class: "ovseg", style: { left: pct(g.from) + "%", width: Math.max(0, pct(g.to) - pct(g.from)) + "%",
          background: `var(${(STATE[g.key] || [0, "--s-queue"])[1]})` } });
        tip(seg, () => `${(STATE[g.key] || [g.key])[0]}\n${new Date(g.from).toLocaleString(LOCALE)} – ${g.open ? t("lanes.now") : new Date(g.to).toLocaleString(LOCALE)}`);
        return seg;
      });
      const btn = el("button", { class: "ovname", title: name, "aria-label": t("overview.open", { name }), onclick: () => selectSession(s.session_id) }, name);
      return el("div", { class: "ovrow" + (s.session_id === ui.session ? " sel" : "") }, btn, el("div", { class: "ovtrack" }, segs));
    });
    box.replaceChildren(el("div", { class: "ovaxis" }, el("span"), el("div", { class: "ovticks" }, ticks)), ...rows);
    legend.replaceChildren(...Object.entries(STATE).filter(([k]) => k !== "archived").map(([, [text, color]]) =>
      el("span", {}, el("i", { style: { background: `var(${color})` } }), text)));
  }

  // ---- Timeline (swimlanes) ----
  const LANE_MIN = 60000; // the closest zoom shows one minute
  const LANE_STEPS = [1, 2, 5, 10, 30, 60, 120, 300, 600, 900, 1800, 3600, 7200, 10800, 21600, 43200, 86400, 172800, 604800, 1209600].map((n) => n * 1000);
  let laneTimer = 0;
  let laneView = null; // the period that the last render showed, for the zoom and pan handlers

  const fmtDur = (ms) => {
    const units = [["day", 86400], ["hour", 3600], ["min", 60], ["sec", 1]];
    let s = Math.max(0, Math.round(ms / 1000));
    const i = Math.max(0, units.findIndex(([, n]) => s >= n || n === 1));
    const parts = [];
    for (const [u, n] of units.slice(i, i + 2)) { const v = Math.floor(s / n); s -= v * n; if (v || !parts.length) parts.push(t("dur." + u, { n: v })); }
    return parts.join(" ");
  };
  const stamp = (ms) => new Date(ms).toLocaleString(LOCALE, { month: "numeric", day: "numeric", hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" });

  // The shown period [from, to] within the whole period [t0, t1]
  function laneWindow(t0, t1) {
    const full = Math.max(1, t1 - t0);
    const { span, end } = ui.lane;
    if (span == null || span >= full) return { t0, t1, from: t0, to: t0 + full, full, whole: true };
    const to = end == null ? t1 : Math.min(t1, Math.max(t0 + span, end));
    return { t0, t1, from: to - span, to, full, whole: false };
  }

  function setLaneWindow(span, from, gesture) {
    const v = laneView;
    if (span >= v.full) ui.lane = { span: null, end: null };
    else {
      const to = Math.min(v.t1, Math.max(v.t0, from) + span);
      ui.lane = { span, end: to >= v.t1 - 1 ? null : to };
    }
    renderLanes(gesture);
  }

  // Zoom around a point: f is its position in the shown period, from 0 (left) to 1 (right)
  function zoomLanes(factor, f, gesture) {
    const v = laneView;
    if (!v) return;
    const span = v.to - v.from;
    const next = Math.max(Math.min(LANE_MIN, v.full), Math.min(v.full, span * factor));
    setLaneWindow(next, v.from + f * (span - next), gesture);
  }
  // A button or a key has no pointer: keep the present in view while following it, else zoom around the middle
  const zoomLanesStep = (factor) => zoomLanes(factor, ui.lane.end == null ? 1 : 0.5);
  function panLanes(ms, gesture) { if (laneView && !laneView.whole) setLaneWindow(laneView.to - laneView.from, laneView.from + ms, gesture); }

  // Cut a name to a width in pixels; a full-width character takes about twice the room of a Latin one
  function fitName(name, room) {
    let used = 0, kept = "";
    for (const c of name) {
      used += c.codePointAt(0) > 0x2e7f ? 12.5 : 7;
      if (used > room) return kept + "…";
      kept += c;
    }
    return name;
  }

  // The runs of one state, each with the id of the event that begins it
  function laneSegments(s, evs, t1) {
    const segs = [];
    for (const e of evs) {
      if (!segs.length || segs[segs.length - 1].state !== e.state_after) segs.push({ state: e.state_after, from: Date.parse(e.ts), id: e.id });
    }
    const closed = ["done", "abandoned", "failed"].includes(s.state);
    const end = closed ? Date.parse(s.updated_at) : s.archived ? Date.parse(s.archived.since) : t1;
    segs.forEach((g, j) => {
      const last = j === segs.length - 1;
      g.to = last ? Math.max(g.from, end) : segs[j + 1].from;
      g.key = last && s.stale ? "stale" : g.state;
      g.open = last && !s.archived; // the tooltip says "now" for the state that still holds
      g.final = last && closed;
    });
    return segs;
  }

  // During a gesture, the table waits until the movement settles: it can hold thousands of rows
  function renderLanes(gesture = false) {
    clearTimeout(laneTimer);
    const box = $("lanes");
    const pad = getComputedStyle(box);
    // Measure before clearing, or the layout of the empty box resets the scroll
    const boxW = box.clientWidth - (parseFloat(pad.paddingLeft) + parseFloat(pad.paddingRight) || 0);
    tipEl.style.display = "none"; // the element under the pointer is about to be replaced
    const sessions = db.sessions.filter((s) => !ui.session || s.session_id === ui.session);
    const all = [...db.events.values()];
    const empty = !sessions.length || !all.length;
    $("lanebar").hidden = $("legend").hidden = empty;
    if (empty) {
      laneView = null;
      box.classList.remove("zoomed");
      $("laneTable").replaceChildren();
      box.replaceChildren(el("div", { class: "empty" }, t("lanes.empty")));
      return;
    }
    let t0 = Infinity, t1 = Date.now();
    for (const e of all) { const at = Date.parse(e.ts); t0 = Math.min(t0, at); t1 = Math.max(t1, at); }
    const view = laneView = laneWindow(t0, t1);
    const { from, to } = view, span = to - from;
    const width = boxW > 0 ? Math.max(300, boxW) : 560;
    const narrow = width < 480;
    const labelW = narrow ? 100 : 160, laneH = 30, top = 22;
    const plotW = width - labelW - 10;
    const x = (ts) => labelW + ((ts - from) / span) * plotW;
    Object.assign(view, { labelW, plotW });
    const NS = "http://www.w3.org/2000/svg";
    const svg = document.createElementNS(NS, "svg");
    const height = top + sessions.length * laneH + 6;
    svg.setAttribute("width", width); svg.setAttribute("height", height);
    svg.setAttribute("role", "img"); svg.setAttribute("aria-label", t("lanes.aria"));
    const mk = (tag, attrs, text) => {
      const n = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) n.setAttribute(k, v);
      if (text != null) n.textContent = text;
      svg.append(n); return n;
    };
    // Time axis: the smallest step whose labels do not touch, on round local times
    const least = span * Math.min(1, 110 / plotW);
    const step = LANE_STEPS.find((n) => n >= least) || Math.ceil(least / 2592e6) * 2592e6;
    const offset = (ms) => new Date(ms).getTimezoneOffset() * 60000;
    for (let local = Math.ceil((from - offset(from)) / step) * step; ; local += step) {
      const tick = local + offset(local + offset(from)); // its own offset, which daylight saving time can change
      if (tick > to) break;
      if (tick < from) continue;
      const d = new Date(tick), date = `${d.getMonth() + 1}/${d.getDate()}`;
      const label = step >= 86400000 ? date : (span > 86400000 ? date + " " : "")
        + (step < 60000 ? d.toLocaleTimeString(LOCALE, { hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" }) : hhmm(tick));
      mk("line", { x1: x(tick), x2: x(tick), y1: top - 4, y2: height, class: "grid" });
      mk("text", { x: x(tick), y: 12, "text-anchor": x(tick) > width - 36 ? "end" : "middle" }, label);
    }
    const bySession = new Map(sessions.map((s) => [s.session_id, []]));
    for (const e of all) bySession.get(e.session_id)?.push(e);
    const lanes = new Map(); // session id -> its state runs
    sessions.forEach((s, i) => {
      const y = top + i * laneH;
      const name = s.title || s.session_id;
      const lg = activeGlow(glowKey.session(s.session_id));
      if (lg) {
        const r = mk("rect", { x: 0, y: y + 2, width, height: laneH - 4, rx: 6, class: "laneglow", fill: lg.color });
        r.style.animationDelay = `-${Math.round(lg.elapsed)}ms`;
      }
      const lbl = mk("text", { x: 0, y: y + laneH / 2 + 4, class: "lname" }, fitName(name, labelW - 8));
      tip(lbl, () => name);
      lbl.addEventListener("click", () => selectSession(s.session_id));
      const evs = bySession.get(s.session_id).sort((a, b) => (a.ts < b.ts ? -1 : 1));
      // State band: from one state change to the next
      const segs = laneSegments(s, evs, t1);
      lanes.set(s.session_id, segs);
      for (const g of segs) {
        if (g.to < from || g.from > to) continue;
        const x0 = x(Math.max(g.from, from)), x1 = x(Math.min(g.to, to));
        const rect = mk("rect", { x: x0, y: y + 8, width: Math.max(6, x1 - x0), height: laneH - 16, rx: 3,
          fill: css((STATE[g.key] || [0, "--s-queue"])[1]), opacity: 0.85 });
        tip(rect, () => `${(STATE[g.key] || [g.key])[0]}\n${new Date(g.from).toLocaleString(LOCALE)} – ${g.open ? t("lanes.now") : new Date(g.to).toLocaleString(LOCALE)}`);
      }
      for (const e of evs) {
        const at = Date.parse(e.ts);
        if (e.type === "heartbeat" || at < from || at > to) continue;
        const c = mk("circle", { cx: x(at), cy: y + laneH / 2, r: e.type === "ask" || e.type === "fail" ? 5 : 3.5,
          class: "evdot", fill: e.type === "ask" ? css("--s-needs") : e.type === "answer" ? css("--accent") : css("--ink") });
        tip(c, () => `${hhmm(e.ts)} ${TYPES[e.type] || e.type}\n${eventText(e)}`);
        c.addEventListener("click", () => jumpTo(e));
      }
    });
    const cursor = mk("line", { y1: top - 4, y2: height, class: "cursor", visibility: "hidden" });
    const point = (at) => {
      if (at != null) { cursor.setAttribute("x1", x(at)); cursor.setAttribute("x2", x(at)); }
      cursor.setAttribute("visibility", at != null && at >= from && at <= to ? "visible" : "hidden");
    };
    box.replaceChildren(svg);
    box.classList.toggle("zoomed", !view.whole);
    $("laneRange").textContent = `${stamp(from)} – ${stamp(to)}`;
    $("laneOut").disabled = $("laneFit").disabled = view.whole;
    $("laneIn").disabled = span <= LANE_MIN;
    const legend = $("legend");
    legend.replaceChildren(...Object.entries(STATE).filter(([k]) => k !== "archived").map(([, [label, color]]) =>
      el("span", {}, el("i", { style: { background: `var(${color})` } }), label)),
      el("span", {}, t("lanes.legend")));
    if (gesture) laneTimer = setTimeout(renderLaneTable, 120, view, lanes, point);
    else renderLaneTable(view, lanes, point);
  }

  // The events of the shown period, plus the ones that began the states in effect at its start
  function renderLaneTable({ from, to }, lanes, point) {
    const box = $("laneTable");
    const runs = new Map(); // event id -> the state run that it begins
    for (const segs of lanes.values()) for (const g of segs) runs.set(g.id, g);
    const rows = filteredEvents().filter((e) => {
      if (!lanes.has(e.session_id)) return false;
      const at = Date.parse(e.ts), g = runs.get(e.id);
      return at >= from ? at <= to : !!g && g.to > from;
    });
    const active = document.activeElement, focused = box.contains(active) && active.dataset.ev;
    const scrolled = box.querySelector(".ctable-wrap")?.scrollLeft || 0;
    const title = el("div", { class: "day" }, t("lanes.list"), " ", el("span", { class: "chip" }, t("col.count", { n: rows.length })));
    if (!rows.length) { box.replaceChildren(title, el("div", { class: "empty" }, t("lanes.listEmpty"))); return; }
    const wrap = el("div", { class: "ctable-wrap" }, el("table", { class: "ctable" },
      el("thead", {}, el("tr", {}, ["time", "session", "event", "state", "duration", "text"].map((c) => el("th", { scope: "col" }, t("lanes.col." + c))))),
      el("tbody", {}, rows.map((e) => {
        const at = Date.parse(e.ts), g = runs.get(e.id), before = at < from;
        return el("tr", { class: before && "before", title: before && t("lanes.before"),
          onmouseenter: () => point(at), onmouseleave: () => point(null), onfocusin: () => point(at), onfocusout: () => point(null) },
          el("td", { class: "nowrap" }, e.type === "heartbeat" && !Object.keys(e.diff || {}).length
            ? el("span", { title: e.ts }, stamp(at)) // the feed collapses these, so it has no row to open
            : el("button", { class: "linkbtn", dataset: { ev: e.id }, title: e.ts, onclick: () => jumpTo(e) }, stamp(at))),
          el("td", { class: "wide" }, sessionName(e.session_id)),
          el("td", { class: "nowrap" }, TYPES[e.type] || e.type),
          el("td", { class: "nowrap" }, e.state_after ? badge(e.state_after) : "-"),
          el("td", { class: "nowrap" }, g && !g.final ? fmtDur(g.to - g.from) : ""),
          el("td", { class: "wide" }, eventText(e)));
      }))));
    box.replaceChildren(title, wrap);
    wrap.scrollLeft = scrolled;
    if (focused) [...box.querySelectorAll("[data-ev]")].find((n) => n.dataset.ev === focused)?.focus({ preventScroll: true });
  }

  // Zoom and pan. The handlers sit on the container, which survives a render.
  function bindLanes() {
    const box = $("lanes");
    // Coalesce the many wheel and pointer events of one frame into one render
    let frame = 0, queued = [];
    const queue = (fn) => {
      queued.push(fn);
      if (!frame) frame = requestAnimationFrame(() => {
        frame = 0;
        const todo = queued; queued = [];
        const merged = todo.reduce((m, q) => ({ ms: m.ms + (q.ms || 0), zoom: m.zoom * (q.zoom || 1), f: q.f ?? m.f }), { ms: 0, zoom: 1, f: 0.5 });
        if (merged.zoom !== 1) zoomLanes(merged.zoom, merged.f, true);
        if (merged.ms) panLanes(merged.ms, true);
      });
    };
    const perPixel = () => (laneView.to - laneView.from) / laneView.plotW;
    box.addEventListener("wheel", (ev) => {
      if (!laneView) return;
      const unit = ev.deltaMode ? 16 : 1;
      if (ev.ctrlKey || ev.metaKey) {
        ev.preventDefault(); // a trackpad pinch arrives as a wheel event with ctrlKey
        const at = ev.clientX - box.querySelector("svg").getBoundingClientRect().left - laneView.labelW;
        const dy = Math.max(-60, Math.min(60, ev.deltaY * unit));
        queue({ zoom: Math.exp(dy * 0.008), f: Math.max(0, Math.min(1, at / laneView.plotW)) });
      } else {
        const dx = ev.shiftKey && !ev.deltaX ? ev.deltaY : ev.deltaX;
        if (laneView.whole || !dx || Math.abs(dx) < Math.abs(ev.deltaY) && !ev.shiftKey) return;
        ev.preventDefault();
        queue({ ms: dx * unit * perPixel() });
      }
    }, { passive: false });
    let drag = null;
    box.addEventListener("pointerdown", (ev) => {
      if (ev.button === 0 && ev.isPrimary && laneView && !laneView.whole) drag = { id: ev.pointerId, x: ev.clientX, moved: false };
    });
    box.addEventListener("pointermove", (ev) => {
      if (!drag || ev.pointerId !== drag.id) return;
      if (!(ev.buttons & 1) || !laneView) { drag = null; box.classList.remove("dragging"); return; }
      // A small movement still counts as a click on a dot or a name
      if (!drag.moved && Math.abs(ev.clientX - drag.x) < 4) return;
      if (!drag.moved) { drag.moved = true; box.setPointerCapture(ev.pointerId); box.classList.add("dragging"); }
      queue({ ms: (drag.x - ev.clientX) * perPixel() });
      drag.x = ev.clientX;
    });
    for (const type of ["pointerup", "pointercancel"]) box.addEventListener(type, () => { drag = null; box.classList.remove("dragging"); });
    box.addEventListener("keydown", (ev) => {
      if (!laneView || ev.ctrlKey || ev.metaKey || ev.altKey) return;
      const span = laneView.to - laneView.from;
      const act = { "+": () => zoomLanesStep(0.5), "=": () => zoomLanesStep(0.5), "-": () => zoomLanesStep(2), "0": fitLanes,
        ArrowLeft: () => panLanes(-span / 4), ArrowRight: () => panLanes(span / 4) }[ev.key];
      if (act) { ev.preventDefault(); act(); }
    });
    const fitLanes = () => { ui.lane = { span: null, end: null }; renderLanes(); };
    $("laneIn").addEventListener("click", () => zoomLanesStep(0.5));
    $("laneOut").addEventListener("click", () => zoomLanesStep(2));
    $("laneFit").addEventListener("click", fitLanes);
  }

  const tipEl = $("tip");
  function tip(node, text) {
    node.addEventListener("mousemove", (ev) => {
      tipEl.textContent = text();
      tipEl.style.whiteSpace = "pre-line";
      tipEl.style.display = "block";
      tipEl.style.left = Math.min(ev.clientX + 12, innerWidth - 330) + "px";
      tipEl.style.top = ev.clientY + 12 + "px";
    });
    node.addEventListener("mouseleave", () => { tipEl.style.display = "none"; });
  }

  // Help icons. The listeners sit on the document, because a render replaces the icons.
  let helpShown = false;
  function showHelp(icon) {
    tipEl.textContent = helpText(icon.dataset.help);
    tipEl.style.whiteSpace = "normal";
    tipEl.style.display = "block";
    tipEl.style.left = tipEl.style.top = "0"; // measure at full width
    const at = icon.getBoundingClientRect(), box = tipEl.getBoundingClientRect();
    tipEl.style.left = Math.max(8, Math.min(at.left, innerWidth - box.width - 8)) + "px";
    tipEl.style.top = (at.bottom + 6 + box.height > innerHeight ? Math.max(8, at.top - 6 - box.height) : at.bottom + 6) + "px";
    helpShown = true;
  }
  function hideHelp() {
    if (helpShown) tipEl.style.display = "none";
    helpShown = false;
  }
  function onHelpPointer(ev) {
    const icon = ev.target.closest?.(".help[data-help]");
    if (icon) showHelp(icon); else hideHelp();
    return icon;
  }
  document.addEventListener("mouseover", onHelpPointer);
  // A tap shows the explanation, and neither selects the card nor folds the group
  document.addEventListener("click", (ev) => { if (onHelpPointer(ev)) { ev.stopPropagation(); ev.preventDefault(); } }, true);
  document.addEventListener("scroll", hideHelp, true);
  document.addEventListener("keydown", (ev) => { if (ev.key === "Escape") hideHelp(); });

  function jumpTo(e) {
    setView("feed");
    selectSession(e.session_id);
    requestAnimationFrame(() => {
      const row = document.getElementById("ev-" + e.id);
      if (row) { row.scrollIntoView({ block: "center" }); row.classList.remove("flash"); void row.offsetWidth; row.classList.add("flash"); }
    });
  }

  // ---- Full render ----
  const sessionOption = (s) => el("option", { value: s.session_id }, s.title || s.session_id);
  function renderHeader() {
    $("kSessions").textContent = db.sessions.length;
    const action = db.sessions.filter((s) => s.needs_action).length;
    $("kAction").textContent = action;
    $("kActive").textContent = db.sessions.filter(isActive).length;
    $("kIn").textContent = fmtNum(db.total.input);
    $("kOut").textContent = fmtNum(db.total.output);
    $("kUpdated").textContent = db.generated_at ? hhmm(db.generated_at) : "-";
    document.title = (action ? `(${action}) ` : "") + "Session Hub";
    const sel = $("fSession");
    const cur = sel.value;
    sel.replaceChildren(el("option", { value: "" }, t("filter.allSessions")),
      ...(ui.byProject
        ? projectGroups(db.sessions).map(([key, list]) => el("optgroup", { label: key || t("project.none") }, list.map(sessionOption)))
        : db.sessions.map(sessionOption)));
    sel.value = cur;
    $("tlScope").textContent = ui.session ? sessionName(ui.session) : t("tl.all");
    const shown = db.sessions.find((s) => s.session_id === ui.session);
    const pr = (shown && shown.pr) || {};
    const prUrl = prWebUrl(pr);
    const link = $("tlPr");
    link.hidden = !prUrl;
    link.textContent = prUrl ? prName(pr) : "";
    link.title = prUrl || "";
    prUrl ? link.setAttribute("href", prUrl) : link.removeAttribute("href");
    const appUrl = desktopUrl(shown);
    const open = $("tlDesktop");
    open.hidden = !appUrl;
    appUrl ? open.setAttribute("href", appUrl) : open.removeAttribute("href");
    $("groupBtn").setAttribute("aria-pressed", String(ui.byProject));
    // In the grid layout, closing the panel clears the selection
    $("clearSel").hidden = !ui.session || ui.layout === "grid";
    // Deleting needs the live hub, so a static export never shows the button
    $("deleteSession").hidden = !ui.session || !!EMBEDDED;
    $("deleteSession").disabled = deleting.has(ui.session);
  }

  // ---- Scrolling and the connector line ----
  // In the split layout (a large window in the list layout) each panel scrolls on its own. In the grid
  // layout the detail panel scrolls as a whole; otherwise the page scrolls.
  const SPLIT = matchMedia("screen and (min-width: 860.02px) and (min-height: 480px)");
  const isSplit = () => SPLIT.matches && ui.layout !== "grid";
  const detailScroller = () => (ui.layout === "grid" ? $("detail") : isSplit() ? $("detailScroll") : window);
  const scrollPos = () => { const n = detailScroller(); return n === window ? window.scrollY : n.scrollTop; };

  // Draw a line from the selected card to the detail panel's title. When the card is scrolled out of
  // the list, the line starts at the nearest edge of the list and turns dashed.
  function drawLink() {
    const svg = $("link");
    const card = isSplit() && ui.session ? $("sessions").querySelector(".card.selected") : null;
    svg.toggleAttribute("hidden", !card);
    $("detail").classList.toggle("linked", !!card);
    if (!card) return;
    const base = document.querySelector("main").getBoundingClientRect();
    const list = $("sessions").getBoundingClientRect();
    const c = card.getBoundingClientRect();
    const h = $("tlTitle").getBoundingClientRect();
    const mid = c.top + c.height / 2;
    // Keep the start on the visible part of the card, or on the list's edge when none is visible
    const top = Math.max(c.top, list.top), bottom = Math.min(c.bottom, list.bottom);
    const off = bottom - top < 8;
    const y = off ? (mid < list.top + list.height / 2 ? list.top + 6 : list.bottom - 6) : Math.min(Math.max(mid, top + 4), bottom - 4);
    const x0 = c.right - base.left, y0 = y - base.top;
    const x1 = h.left - base.left, y1 = h.top + h.height / 2 - base.top;
    const xm = (list.right - base.left + x1) / 2;
    const dy = y1 - y0, dir = Math.sign(dy), rad = Math.min(8, Math.abs(dy) / 2);
    svg.classList.toggle("off", off);
    svg.querySelector("path").setAttribute("d", `M${x0} ${y0}H${xm - rad}Q${xm} ${y0} ${xm} ${y0 + dir * rad}`
      + `V${y1 - dir * rad}Q${xm} ${y1} ${xm + rad} ${y1}H${x1}`);
    for (const [cls, x, cy] of [["from", x0, y0], ["to", x1, y1]]) {
      const dot = svg.querySelector("." + cls);
      dot.setAttribute("cx", x); dot.setAttribute("cy", cy);
    }
  }

  // Scroll the list, and only the list, until the selected card is visible
  function revealSelectedCard() {
    const box = $("sessions"), card = box.querySelector(".card.selected");
    if (!isSplit() || !card) return;
    const b = box.getBoundingClientRect(), c = card.getBoundingClientRect();
    if (c.top < b.top || c.height > b.height) box.scrollTop -= b.top - c.top;
    else if (c.bottom > b.bottom) box.scrollTop += c.bottom - b.bottom;
    drawLink();
  }

  // Rebuilding the DOM can clamp a panel's scroll position, so put both positions back afterwards.
  function render() {
    const panes = [$("sessions"), $("detail"), $("detailScroll")].map((n) => [n, n.scrollTop]);
    renderContent();
    for (const [n, top] of panes) n.scrollTop = top;
    drawLink();
  }

  function renderContent() {
    renderHeader();
    renderSessions();
    renderColTabs();
    if (ui.view === "feed") renderFeed();
    else if (ui.view === "lanes") renderLanes();
    else if (ui.view === "overview") renderOverview();
    else renderCollection(ui.view.slice(4));
  }

  function selectSession(sid) {
    const changed = ui.session !== sid;
    ui.session = sid;
    $("fSession").value = sid;
    render();
    if (changed) {
      if (isSplit()) $("detailScroll").scrollTop = 0;
      revealSelectedCard();
    }
  }

  // ---- Layout (list or grid) and the detail panel of the grid ----
  function toggleCard(sid) {
    const same = ui.session === sid;
    if (ui.layout !== "grid") return selectSession(same ? "" : sid);
    if (same && ui.panelOpen) return closePanel();
    openPanel(sid);
  }

  // Opening or closing the panel reflows the cards. Run `change`, then scroll the window so that the
  // card `sid` (or else the first visible card) keeps its place on the screen.
  function keepCardInPlace(sid, change) {
    const top = document.querySelector("header").offsetHeight;
    const cards = [...document.querySelectorAll(".card")].filter((c) => c.getClientRects().length);
    const anchor = cards.find((c) => c.dataset.sid === sid)
      || (scrollY > 0 && cards.find((c) => c.getBoundingClientRect().bottom > top));
    const id = anchor && anchor.dataset.sid;
    const before = anchor && anchor.getBoundingClientRect().top;
    change();
    const after = id && [...document.querySelectorAll(".card")].find((c) => c.dataset.sid === id); // Rendering replaces the cards
    if (after && after.getClientRects().length) window.scrollBy({ top: after.getBoundingClientRect().top - before, behavior: "instant" });
  }

  function openPanel(sid) {
    ui.panelOpen = true;
    $("detail").classList.add("slide");
    clearUnseen();
    keepCardInPlace(sid, () => { applyLayout(); selectSession(sid); });
    $("detail").scrollTop = 0;
    $("detail").focus({ preventScroll: true });
  }

  const gridButton = () => document.querySelector('[data-layout="grid"]');
  function closePanel() {
    const sid = ui.session;
    ui.panelOpen = false;
    $("detail").classList.add("slide");
    clearUnseen();
    keepCardInPlace(sid, () => { applyLayout(); selectSession(""); });
    const card = [...document.querySelectorAll(".card")].find((c) => c.dataset.sid === sid);
    (card || gridButton()).focus({ preventScroll: true });
  }

  // ---- The width of the grid's detail panel ----
  // The preferred width in pixels, or null for the default of --detail-w. A small window clamps the shown
  // width and keeps the preference. PANEL_ROOM leaves one card column and its padding beside the panel.
  const PANEL_MIN = 360, PANEL_ROOM = 376, PANEL_STEP = 24;
  let panelPref = null, panelDrag = null;
  try { const w = Number(localStorage.getItem("hub.panelWidth")); if (w > 0 && isFinite(w)) panelPref = w; } catch (_) {}
  const panelMax = () => Math.max(PANEL_MIN, document.documentElement.clientWidth - PANEL_ROOM);
  const panelWidth = () => Math.round(Math.min(panelMax(), Math.max(PANEL_MIN,
    panelPref ?? Math.min(720, document.documentElement.clientWidth * 0.55)))); // Keep the default in sync with --detail-w

  function applyPanelWidth() {
    const root = document.documentElement.style, handle = $("panelResize"), width = panelWidth();
    const value = panelPref == null ? "" : width + "px";
    handle.setAttribute("aria-valuemin", PANEL_MIN);
    handle.setAttribute("aria-valuemax", panelMax());
    handle.setAttribute("aria-valuenow", width);
    if (root.getPropertyValue("--detail-w") === value) return;
    keepCardInPlace(ui.session, () => { value ? root.setProperty("--detail-w", value) : root.removeProperty("--detail-w"); });
    if ((ui.view === "lanes" || ui.view === "overview") && ui.layout === "grid" && ui.panelOpen) { // The drawing depends on the width
      const top = $("detail").scrollTop;
      ui.view === "lanes" ? renderLanes() : renderOverview();
      $("detail").scrollTop = top;
    }
  }

  function savePanelWidth() {
    try {
      if (panelPref == null) localStorage.removeItem("hub.panelWidth");
      else localStorage.setItem("hub.panelWidth", String(panelPref));
    } catch (_) {}
  }

  function setPanelWidth(width) {
    panelPref = width == null ? null : Math.min(panelMax(), Math.max(PANEL_MIN, Math.round(width)));
    applyPanelWidth();
  }

  // Finish a drag: keep its width, or go back to the preference from before it
  function endPanelDrag(keep) {
    const drag = panelDrag;
    if (!drag) return;
    panelDrag = null;
    cancelAnimationFrame(drag.frame);
    $("panelResize").classList.remove("active");
    if (!drag.moved) return;
    if (keep) { setPanelWidth(drag.width); savePanelWidth(); }
    else { panelPref = drag.pref; applyPanelWidth(); }
  }

  function bindPanelResize() {
    const handle = $("panelResize");
    handle.addEventListener("mousedown", (e) => e.preventDefault()); // Start no text selection
    handle.addEventListener("pointerdown", (e) => {
      if (panelDrag || e.button !== 0 || !e.isPrimary) return;
      const width = panelWidth();
      panelDrag = { id: e.pointerId, x: e.clientX, start: width, width, pref: panelPref, moved: false, frame: 0 };
      handle.setPointerCapture(e.pointerId);
      handle.focus({ preventScroll: true });
      handle.classList.add("active");
      $("detail").classList.remove("slide");
    });
    handle.addEventListener("pointermove", (e) => {
      const drag = panelDrag;
      if (!drag || e.pointerId !== drag.id) return;
      if (!handle.getClientRects().length) return endPanelDrag(false); // The panel closed during the drag
      const width = drag.start + drag.x - e.clientX;
      if (!drag.moved && width === drag.start) return;
      drag.moved = true;
      drag.width = width;
      cancelAnimationFrame(drag.frame);
      drag.frame = requestAnimationFrame(() => setPanelWidth(drag.width));
    });
    const on = (type, keep) => handle.addEventListener(type, (e) => { if (panelDrag && e.pointerId === panelDrag.id) endPanelDrag(keep); });
    on("pointerup", true);
    on("pointercancel", false);
    on("lostpointercapture", false);
    handle.addEventListener("dblclick", () => { setPanelWidth(null); savePanelWidth(); });
    handle.addEventListener("keydown", (e) => {
      if (panelDrag) {
        if (e.key === "Escape") { e.preventDefault(); e.stopPropagation(); endPanelDrag(false); }
        return;
      }
      if (e.ctrlKey || e.metaKey || e.altKey) return;
      const width = { ArrowLeft: panelWidth() + PANEL_STEP, ArrowRight: panelWidth() - PANEL_STEP, Home: PANEL_MIN, End: panelMax() }[e.key];
      if (width === undefined) return;
      e.preventDefault();
      setPanelWidth(width);
      savePanelWidth();
    });
    window.addEventListener("resize", applyPanelWidth);
    applyPanelWidth();
  }

  function applyLayout() {
    const grid = ui.layout === "grid";
    $("main").classList.toggle("grid", grid);
    $("main").classList.toggle("withpanel", grid && ui.panelOpen);
    document.body.classList.toggle("gridlayout", grid);
    // Only a panel that scrolls on its own takes keyboard focus
    for (const id of ["sessions", "detailScroll"]) isSplit() ? ($(id).tabIndex = 0) : $(id).removeAttribute("tabindex");
    $("detail").classList.toggle("open", grid && ui.panelOpen);
    $("detail").inert = grid && !ui.panelOpen;
    $("closePanel").hidden = !grid;
    document.querySelectorAll("[data-layout]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.layout === ui.layout)));
    applyFullscreen();
  }

  // ---- Fullscreen (the grid's open panel covers the window) ----
  function applyFullscreen() {
    const button = $("fullscreenPanel"), on = ui.fullscreen && ui.layout === "grid" && ui.panelOpen;
    ui.fullscreen = on;
    $("main").classList.toggle("fullscreen", on);
    // Keep the keyboard and screen readers out of what the panel covers
    document.querySelector("header").inert = $("sessions").closest("section").inert = on;
    button.hidden = ui.layout !== "grid";
    button.setAttribute("aria-pressed", String(on));
    button.dataset.i18nTitle = on ? "panel.fullscreenOff" : "panel.fullscreenOn";
    button.title = t(button.dataset.i18nTitle);
  }

  function setFullscreen(on) {
    const box = $("detail");
    // The new width reflows the panel: keep the first visible row where it is, below the sticky title
    const rows = () => [...box.querySelectorAll(".ev, .kcard, .ctable tbody tr")].filter((n) => n.getClientRects().length);
    const below = (n) => n.getBoundingClientRect().top - $("tlTitle").getBoundingClientRect().bottom;
    const at = box.scrollTop > 0 ? rows().findIndex((n) => below(n) + n.offsetHeight > 0) : -1;
    const before = at >= 0 && below(rows()[at]);
    tipEl.style.display = "none"; // what it describes moves away from the pointer
    keepCardInPlace(ui.session, () => {
      ui.fullscreen = on;
      applyLayout();
      if (ui.view === "lanes" || ui.view === "overview") render(); // both are drawn to the panel's width
    });
    const row = at >= 0 && rows()[at];
    if (row) box.scrollTop += below(row) - before;
    if (!box.contains(document.activeElement)) $("fullscreenPanel").focus({ preventScroll: true }); // Safari does not focus a clicked button
  }
  $("fullscreenPanel").addEventListener("click", () => setFullscreen(!ui.fullscreen));

  function setLayout(layout) {
    ui.layout = layout;
    $("detail").classList.remove("slide");
    ui.panelOpen = layout === "grid" && !!ui.session; // Keep showing the selected session
    try { localStorage.setItem("hub.layout", layout); } catch (_) {}
    clearUnseen();
    applyLayout();
    render();
  }

  const timelineShown = () => ui.layout !== "grid" || ui.panelOpen;
  function clearUnseen() { ui.unseen = 0; $("newbar").classList.remove("show"); }

  function setView(v) {
    if (v.startsWith("col:") && !db.collections[v.slice(4)]) v = "feed";
    const changed = ui.view !== v;
    ui.view = v;
    const isCol = v.startsWith("col:");
    $("feedView").hidden = v !== "feed";
    $("lanesView").hidden = v !== "lanes";
    $("overviewView").hidden = v !== "overview";
    if (v !== "overview") $("overview").replaceChildren(); // Leave no stale content in a hidden tab
    $("colView").hidden = !isCol;
    if (!isCol) $("colView").replaceChildren(); // Leave no stale content (such as a glow) in a hidden tab
    // The type, heartbeat, and order controls apply to the timeline alone
    const unfiltered = v === "overview"; // it draws every session and lists no event
    $("fTypes").hidden = isCol || unfiltered;
    $("fHeartbeat").parentElement.hidden = isCol || unfiltered;
    $("fOrder").parentElement.hidden = isCol || unfiltered;
    $("fText").hidden = unfiltered;
    updateViewText();
    render();
    if (changed && isSplit()) $("detailScroll").scrollTop = 0;
  }

  // ---- Collections (knowledge and other stores of accumulated updates) ----
  const GROUP_COLOR = { caveat: "--s-needs", issue: "--s-fail", decision: "--accent", howto: "--s-review", insight: "--s-work" };

  function renderColTabs() {
    const box = $("colTabs");
    const names = Object.keys(db.collections);
    if (box.dataset.sig !== LANG + names.join(",") + "|" + names.map((n) => db.collections[n].active).join(",")) {
      box.dataset.sig = LANG + names.join(",") + "|" + names.map((n) => db.collections[n].active).join(",");
      box.replaceChildren(...names.map((n) => {
        const c = db.collections[n];
        return el("button", { role: "tab", "data-view": "col:" + n, title: L(c.description) || L(c.label),
          onclick: () => setView("col:" + n) }, `${L(c.label)} (${c.active})`);
      }));
    }
    document.querySelectorAll(".tabs button").forEach((b) => b.setAttribute("aria-selected", String(b.dataset.view === ui.view)));
  }

  function itemText(it) {
    return [it.title, it.body, it.summary, it.kind, ...(it.tags || []), ...(it.scopes || [])].filter(Boolean).join(" ").toLowerCase();
  }

  function collectionItems(col) {
    const q = ui.text.toLowerCase();
    return col.items.filter((it) =>
      (ui.showObsolete || (it.status || "active") === "active") &&
      (!ui.session || (it.reporters || []).includes(ui.session)) &&
      (!q || itemText(it).includes(q)));
  }

  function sourceLinks(it) {
    // Clicking a reporting session jumps to its event in the timeline
    const latest = new Map();
    for (const s of it.sources || []) latest.set(s.session_id, s);
    return [...latest.values()].map((s) => el("span", { class: "src", style: { color: laneColor(s.session_id) }, title: s.event_id,
      onclick: () => { const e = db.events.get(s.event_id); if (e) jumpTo(e); } }, sessionName(s.session_id)));
  }

  function renderCollection(name) {
    const col = db.collections[name];
    const box = $("colView");
    box.replaceChildren();
    if (!col) return;
    const view = col.view || {};
    const items = collectionItems(col);
    const groupsOn = ui.colGroups[name] || (ui.colGroups[name] = new Set());
    const bar = el("div", { class: "colbar" },
      col.description ? el("span", { class: "desc" }, L(col.description)) : null,
      el("span", {}, t("col.count", { n: items.length })),
      el("label", {}, el("input", { type: "checkbox", ...(ui.showObsolete ? { checked: true } : {}),
        onchange: (e) => { ui.showObsolete = e.target.checked; render(); } }), t("col.showObsolete")));
    box.append(bar);
    if (view.type === "cards" && view.group_by) {
      const counts = {};
      for (const it of items) counts[it[view.group_by]] = (counts[it[view.group_by]] || 0) + 1;
      const order = [...(view.order || []), ...Object.keys(counts).filter((g) => !(view.order || []).includes(g))];
      bar.append(...order.filter((g) => counts[g]).map((g) => el("button", { class: "iconbtn", "aria-pressed": String(!groupsOn.has(g)),
        onclick: () => { groupsOn.has(g) ? groupsOn.delete(g) : groupsOn.add(g); render(); } },
        `${L((view.groups || {})[g]) || g} ${counts[g]}`)));
    }
    if (!items.length) {
      box.append(el("div", { class: "empty" }, col.items.length ? t("col.emptyFiltered") : t("col.empty")));
      return;
    }
    if (view.type === "table") return box.append(collectionTable(col, items));
    const by = view.group_by;
    const groups = new Map();
    for (const it of items) {
      const g = by ? String(it[by] ?? "") : "";
      if (groupsOn.has(g)) continue;
      if (!groups.has(g)) groups.set(g, []);
      groups.get(g).push(it);
    }
    const order = [...(view.order || []), ...[...groups.keys()].filter((g) => !(view.order || []).includes(g))];
    for (const g of order) {
      if (!groups.has(g)) continue;
      const color = `var(${GROUP_COLOR[g] || "--s-queue"})`;
      box.append(el("div", { class: "kgroup" },
        by ? el("h3", {}, el("span", { class: "badge", style: { background: color } }, L((view.groups || {})[g]) || g || "-"),
          t("col.groupCount", { n: groups.get(g).length })) : null,
        el("div", { class: "kgrid" }, groups.get(g).map((it) => knowledgeCard(it, color)))));
    }
  }

  function knowledgeCard(it, color) {
    return el("article", glowProps((it.sources || []).map((s) => glowKey.event(s.event_id)),
      { class: "kcard" + ((it.status || "active") !== "active" ? " obsolete" : ""), style: { "--kc": color } }),
      el("div", { class: "ktitle" }, it.title || it.summary || it.key),
      it.body ? el("div", { class: "kbody" }, it.body) : null,
      el("div", { class: "kmeta" },
        (it.tags || []).map((tag) => el("span", { class: "chip", style: { cursor: "pointer" }, title: t("tag.search"),
          onclick: () => { $("fText").value = tag; ui.text = tag; render(); } }, "#" + tag)),
        (it.scopes || []).map((sc) => el("span", { class: "chip" }, "@" + sc)),
        (it.status || "active") !== "active" ? el("span", { class: "chip" }, t("chip.obsolete")) : null),
      el("div", { class: "kmeta" },
        it.count > 1 ? el("b", {}, t("k.reported", { s: it.reporters.length, n: it.count })) : null,
        t("k.by"), sourceLinks(it), el("span", { "data-ago": it.last_ts }, ago(it.last_ts))));
  }

  function collectionTable(col, items) {
    const cols = (col.view && col.view.columns) || ["title", "kind", "reporters", "last_ts"];
    const cell = (it, c) => {
      if (c === "reporters") return el("td", {}, sourceLinks(it));
      if (c === "last_ts" || c === "first_ts") return el("td", { title: it[c] }, ago(it[c]));
      const v = it[c];
      return el("td", {}, Array.isArray(v) ? v.join(", ") : v == null ? "" : typeof v === "object" ? JSON.stringify(v) : String(v));
    };
    const label = Object.fromEntries(["title", "kind", "reporters", "last_ts", "first_ts", "body", "count", "tags"]
      .map((c) => [c, t("th." + c)]));
    return el("div", { class: "ctable-wrap" }, el("table", { class: "ctable" },
      el("thead", {}, el("tr", {}, cols.map((c) => el("th", {}, label[c] || c)))),
      el("tbody", {}, items.map((it) => el("tr", glowProps((it.sources || []).map((s) => glowKey.event(s.event_id))),
        cols.map((c) => cell(it, c)))))));
  }

  // ---- Data intake ----
  function loadSnapshot(snap) {
    db.events = new Map(snap.events.map((e) => [e.id, e]));
    applySessions(snap, true);
    render();
  }

  function applyUpdate(u) {
    const fresh = [];
    for (const id of u.removed || []) db.events.delete(id);
    for (const e of u.events || []) {
      if (!db.events.has(e.id)) fresh.push(e);
      db.events.set(e.id, e);
    }
    ui.fresh = new Set(fresh.map((e) => e.id));
    for (const e of fresh) {
      if (e.type === "heartbeat") continue; // Do not glow for automatic hook sends
      // The grey of a queued or done session reads as a plain shadow, so those glow in the accent color
      const name = (STATE[e.state_after] || [0, "--accent"])[1];
      const color = css(["--s-queue", "--s-done"].includes(name) ? "--accent" : name) || css("--accent");
      markGlow(glowKey.event(e.id), color);
      markGlow(glowKey.session(e.session_id), color);
    }
    applySessions(u, false);
    // While the reader is scrolled down, announce new items in the new-items bar instead of moving the view
    const visible = fresh.filter((e) => e.type !== "heartbeat" || ui.heartbeat);
    if (visible.length && timelineShown() && scrollPos() > 200 && !ui.asc) {
      ui.unseen += visible.length;
      $("newbarText").textContent = t("newbar", { n: ui.unseen });
      $("newbar").classList.add("show");
    }
    render();
  }

  function applySessions(snap, initial) {
    db.sessions = snap.sessions;
    const live = new Set(db.sessions.map((s) => s.session_id));
    for (const sid of [...prevStates.keys()]) if (!live.has(sid)) prevStates.delete(sid);
    // Another viewer may delete the selected session; fall back to showing every session
    if (ui.session && !live.has(ui.session)) {
      ui.session = ""; $("fSession").value = "";
      // The focus is on <body> when the delete button, disabled during its request, held it
      const focused = document.activeElement;
      const refocus = ui.layout === "grid" && ui.panelOpen && (focused === document.body || $("detail").contains(focused));
      ui.panelOpen = false;
      applyLayout();
      if (refocus) gridButton().focus({ preventScroll: true });
    }
    db.total = snap.total || {};
    if (snap.collections) db.collections = snap.collections;
    db.generated_at = snap.generated_at;
    for (const s of db.sessions) {
      const key = stateKey(s);
      const prev = prevStates.get(s.session_id);
      if (!initial && prev !== key && (ESCALATE.has(key) || key === "stale")) notify(s, key);
      prevStates.set(s.session_id, key);
    }
  }

  function notify(s, key) {
    if (!ui.notify || !("Notification" in window) || Notification.permission !== "granted") return;
    const body = key === "needs_human" && s.attention ? s.attention.question : s.summary || "";
    try { new Notification(`${(STATE[key] || [key])[0]}: ${s.title || s.session_id}`, { body, tag: s.session_id }); } catch (_) {}
  }

  // ---- Connection (SSE, falling back to polling after repeated failures) ----
  // The connection label is stored as a message key, so a language switch can re-render it.
  let connState = { kind: "", key: "conn.connecting", params: {} };
  function setConn(kind, key, params = {}) {
    connState = { kind, key, params };
    $("conn").className = "conn " + kind;
    $("connText").textContent = t(key, params);
  }

  let failures = 0, pollTimer = null;
  function connect() {
    if (!("EventSource" in window)) return startPolling();
    const es = new EventSource("api/stream");
    es.addEventListener("snapshot", (m) => { failures = 0; setConn("live", "conn.live"); loadSnapshot(JSON.parse(m.data)); });
    es.addEventListener("update", (m) => applyUpdate(JSON.parse(m.data)));
    es.onerror = () => {
      failures++;
      setConn("retry", "conn.retry");
      if (failures >= 5) { es.close(); startPolling(); }
    };
  }
  function startPolling() {
    setConn("retry", "conn.polling");
    const tick = async () => {
      try {
        const r = await fetch("api/snapshot", { cache: "no-store" });
        const snap = await r.json();
        const known = new Set(db.events.keys());
        if (!db.generated_at) loadSnapshot(snap);
        else {
          const ids = new Set(snap.events.map((e) => e.id));
          applyUpdate({ ...snap, removed: [...known].filter((id) => !ids.has(id)),
                        events: snap.events.filter((e) => !known.has(e.id) || JSON.stringify(db.events.get(e.id)) !== JSON.stringify(e)) });
        }
      } catch (_) { setConn("", "conn.down"); }
      pollTimer = setTimeout(tick, 5000);
    };
    tick();
  }

  // ---- UI events ----
  document.querySelectorAll(".tabs button").forEach((b) => b.addEventListener("click", () => setView(b.dataset.view)));
  $("fSession").addEventListener("change", (e) => selectSession(e.target.value));
  $("groupBtn").addEventListener("click", () => {
    ui.byProject = !ui.byProject;
    try { localStorage.setItem("hub.byProject", ui.byProject ? "1" : "0"); } catch (_) {}
    render();
  });
  $("clearSel").addEventListener("click", () => selectSession(""));
  async function deleteSession(sid) {
    if (!sid || deleting.has(sid)) return;
    let n = 0;
    for (const e of db.events.values()) if (e.session_id === sid) n++;
    if (!confirm(t("sessions.deleteConfirm", { n, name: sessionName(sid) }))) return;
    deleting.add(sid);
    render();
    try {
      const r = await fetch("api/sessions/" + encodeURIComponent(sid), { method: "DELETE", cache: "no-store" });
      if (!r.ok) {
        let msg = r.status + " " + r.statusText;
        try { msg = (await r.json()).error || msg; } catch (_) {}
        throw new Error(msg);
      }
      // The update message that follows removes the session's events, card, and collection entries
      if (ui.session === sid) { if (ui.layout === "grid") closePanel(); else selectSession(""); }
    } catch (err) {
      alert(t("sessions.deleteFailed", { error: err.message }));
    } finally {
      deleting.delete(sid);
      render();
    }
  }
  $("deleteSession").addEventListener("click", () => deleteSession(ui.session));
  let textTimer;
  $("fText").addEventListener("input", (e) => { clearTimeout(textTimer); textTimer = setTimeout(() => { ui.text = e.target.value; render(); }, 150); });
  $("fHeartbeat").addEventListener("change", (e) => { ui.heartbeat = e.target.checked; render(); });
  $("fOrder").addEventListener("change", (e) => { ui.asc = e.target.checked; render(); });
  function renderTypeFilters() {
    $("fTypes").replaceChildren(...Object.entries(TYPES).filter(([type]) => type !== "heartbeat").map(([type, label]) =>
      el("button", { "aria-pressed": String(ui.types.has(type)), onclick: (ev) => {
        ui.types.has(type) ? ui.types.delete(type) : ui.types.add(type);
        ev.currentTarget.setAttribute("aria-pressed", String(ui.types.has(type)));
        render();
      } }, label)));
  }

  // The panel title and the search placeholder depend on the current view as well as the language.
  function updateViewText() {
    const col = ui.view.startsWith("col:") && db.collections[ui.view.slice(4)];
    $("fText").placeholder = col ? t("filter.textCol") : t("filter.textFeed");
    $("tlName").textContent = col ? L(col.label) : t("tl.title");
  }

  // Fill every node marked with data-i18n, data-i18n-title, or data-i18n-aria in the current language.
  function applyStaticText() {
    document.documentElement.lang = LANG;
    document.querySelectorAll("[data-i18n]").forEach((n) => { n.textContent = t(n.dataset.i18n); });
    document.querySelectorAll("[data-i18n-title]").forEach((n) => { n.title = t(n.dataset.i18nTitle); });
    document.querySelectorAll("[data-i18n-aria]").forEach((n) => n.setAttribute("aria-label", t(n.dataset.i18nAria)));
    $("connText").textContent = t(connState.key, connState.params);
    $("newbarText").textContent = t("newbar", { n: ui.unseen });
    updateViewText();
  }

  function setLang(lang) {
    LANG = lang;
    LOCALE = lang === "ja" ? "ja-JP" : "en-US";
    try { localStorage.setItem("hub.lang", lang); } catch (_) {}
    buildLabels();
    applyStaticText();
    renderTypeFilters();
    $("colTabs").dataset.sig = ""; // force the collection tabs to re-render their labels
    setView(ui.view);
  }
  $("langBtn").addEventListener("click", () => setLang(LANG === "ja" ? "en" : "ja"));
  applyStaticText();
  renderTypeFilters();
  $("newbar").addEventListener("click", () => {
    clearUnseen();
    detailScroller().scrollTo({ top: 0, behavior: "smooth" });
  });
  function clearUnseenAtTop() { if (scrollPos() < 100 && ui.unseen) clearUnseen(); }
  for (const target of [window, $("detail"), $("detailScroll")]) target.addEventListener("scroll", clearUnseenAtTop);
  $("sessions").addEventListener("scroll", drawLink);
  SPLIT.addEventListener("change", () => { applyLayout(); drawLink(); clearUnseenAtTop(); });
  if ("ResizeObserver" in window) {
    const ro = new ResizeObserver(drawLink);
    for (const n of [$("sessions"), $("detail"), $("tlTitle")]) ro.observe(n);
  }
  document.querySelectorAll("[data-layout]").forEach((b) => b.addEventListener("click", () => setLayout(b.dataset.layout)));
  $("closePanel").addEventListener("click", closePanel);
  document.addEventListener("keydown", (e) => {
    if (e.key !== "Escape" || e.isComposing || ui.layout !== "grid" || !ui.panelOpen) return;
    if (e.target === $("fText") && e.target.value) { // Clear the search field first; not every browser does it
      e.preventDefault();
      clearTimeout(textTimer);
      e.target.value = ui.text = "";
      render();
      return;
    }
    if (ui.fullscreen) return setFullscreen(false);
    if (!e.repeat) closePanel(); // A held key leaves fullscreen without closing the panel as well
  });
  // The panel starts below the sticky header, whose height changes when it wraps
  const measureHeader = () => document.documentElement.style.setProperty("--header-h", document.querySelector("header").offsetHeight + "px");
  measureHeader();
  if ("ResizeObserver" in window) new ResizeObserver(measureHeader).observe(document.querySelector("header"));
  applyLayout();
  $("notifyBtn").setAttribute("aria-pressed", String(ui.notify));
  $("notifyBtn").addEventListener("click", async () => {
    if (!ui.notify && "Notification" in window && Notification.permission !== "granted") {
      if ((await Notification.requestPermission()) !== "granted") return;
    }
    ui.notify = !ui.notify;
    $("notifyBtn").setAttribute("aria-pressed", String(ui.notify));
    try { localStorage.setItem("hub.notify", ui.notify ? "1" : "0"); } catch (_) {}
  });
  $("themeBtn").addEventListener("click", () => {
    const root = document.documentElement;
    const dark = root.dataset.theme ? root.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
    root.dataset.theme = dark ? "light" : "dark";
    try { localStorage.setItem("hub.theme", root.dataset.theme); } catch (_) {}
    if (ui.view === "lanes") render();
  });
  try { const theme = localStorage.getItem("hub.theme"); if (theme) document.documentElement.dataset.theme = theme; } catch (_) {}
  window.addEventListener("resize", () => { if (ui.view === "lanes" || ui.view === "overview") render(); else drawLink(); });
  bindLanes();
  bindPanelResize();
  // Refresh the "N minutes ago" labels periodically
  setInterval(() => {
    document.querySelectorAll("[data-ago]").forEach((n) => { n.textContent = ago(n.dataset.ago); });
    drawLink(); // A longer label can wrap and move the selected card
  }, 15000);

  $("guideLink").hidden = $("playbookLink").hidden = !!EMBEDDED; // an exported file has no hub to serve these pages
  if (EMBEDDED) { setConn("", "conn.static", { ts: new Date(EMBEDDED.generated_at).toLocaleString(LOCALE) }); loadSnapshot(EMBEDDED); }
  else connect();
})();
</script>
</body>
</html>
