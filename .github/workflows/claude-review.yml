# Advisory pull request review by Claude Code.
#
# Claude Code reviews each pull request against this repository's own contract
# (.github/claude-review-prompt.md: the ground rules, compatibility, security, tests, and the prose
# norms) and posts inline, line-level comments alone. It posts no top-level summary, because a fresh
# summary from each of a pull request's runs would leave stale, contradictory overviews on it.
#
# WHEN IT RUNS: automatically when a pull request opens or reopens, and after that only when a trusted
# person (OWNER, MEMBER, or COLLABORATOR) writes `@claude review` on the pull request. It does not
# re-review every push (`synchronize` is not a trigger): a per-push review can post a finding on the
# fix for its own previous finding, so the fix-push-review cycle need never converge.
#
# Every run reads the full diff, so no changed line goes unreviewed, and also receives every finding
# already posted on the pull request, with an instruction never to re-post one. The review dedupes by
# suppressing repeats, not by narrowing what it reads. A request from anyone else is dropped silently:
# the gate is a job-level `if:`, so the run still completes green with the `claude review` job
# skipped. A requester confirms that the job actually started rather than reading silence as a clean
# review.
#
# ADVISORY ONLY: do not add this job to `main`'s required status checks. A review that found issues
# is a successful review; the job fails only on an infrastructure error, never on a finding.
#
# AUTH: the `claude-review` Environment holds the credential, picked at run time (the gate step):
# - a Claude Code subscription, through the `CLAUDE_CODE_OAUTH_TOKEN` secret (from `claude
#   setup-token`), preferred when present; or
# - Amazon Bedrock, through GitHub's OpenID Connect (OIDC) token exchanged for short-lived AWS
#   credentials (the `AWS_BEDROCK_ROLE_ARN` secret plus the `BEDROCK_MODEL_ID` variable; no static key).
# With neither configured, the job is a green no-op. A `pull_request` run from a fork receives no
# secrets by GitHub's design, so a maintainer reviews a fork's pull request on demand with
# `@claude review`. We deliberately avoid `pull_request_target`, which would run with secrets against
# untrusted fork code.
name: Claude review

on:
  pull_request:
    types: [opened, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# The minimum the job needs: read the diff, post review comments, and mint the OIDC token that the
# Bedrock credential exchange requires (unused on the subscription path).
permissions:
  contents: read
  pull-requests: write
  id-token: write

# One group per pull request and event type. A reopen cancels a still-running review from the open,
# while comment-triggered runs stay independent: a comment posted mid-review (even `@claude review`
# itself) would otherwise cancel a pass someone asked for. Two quick requests therefore run side by
# side, and each reads the prior findings before the other posts its own, so an overlap can post
# duplicate comments: ask for one pass at a time.
concurrency:
  group: claude-review-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Keep this job off main's required status checks: the review is advisory.
  review:
    name: claude review
    runs-on: ubuntu-latest
    # A review takes several minutes; a run far beyond this is a hang (a provider outage or a runaway
    # tool loop), so cap it instead of GitHub's 360-minute default.
    timeout-minutes: 20
    # A comment event runs only when it is on a pull request, contains `@claude review`, and comes
    # from a trusted person. `issue_comment` runs with the repository's secrets even on a fork's pull
    # request, so the association check is what stops an untrusted commenter from starting a
    # credentialed run.
    if: >-
      github.event_name == 'pull_request' ||
      (
        (
          (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
          github.event_name == 'pull_request_review_comment'
        ) &&
        contains(github.event.comment.body, '@claude review') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      )
    # Scope the review credential to this Environment, so no other job can read it.
    environment: claude-review
    steps:
      - name: Pick the AI provider (or no-op)
        id: gate
        env:
          OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ROLE_ARN: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          MODEL_ID: ${{ vars.BEDROCK_MODEL_ID }}
        run: |
          # Prefer the subscription token; otherwise use Bedrock. Enable a provider only when all of
          # its inputs exist (Bedrock needs both the role and the model id), so a half-configured
          # Environment stays a dormant no-op instead of turning the advisory check red.
          if [ -n "$OAUTH_TOKEN" ]; then
            echo "provider=oauth" >> "$GITHUB_OUTPUT"
          elif [ -n "$ROLE_ARN" ] && [ -n "$MODEL_ID" ]; then
            echo "provider=bedrock" >> "$GITHUB_OUTPUT"
          else
            echo "provider=none" >> "$GITHUB_OUTPUT"
            if [ -n "$ROLE_ARN" ] && [ -z "$MODEL_ID" ]; then
              echo "::notice::AWS_BEDROCK_ROLE_ARN is set but the BEDROCK_MODEL_ID variable is missing; the advisory Claude review is dormant. No-op."
            elif [ -z "$ROLE_ARN" ] && [ -n "$MODEL_ID" ]; then
              echo "::notice::BEDROCK_MODEL_ID is set but the AWS_BEDROCK_ROLE_ARN secret is missing; the advisory Claude review is dormant. No-op."
            else
              echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor AWS_BEDROCK_ROLE_ARN (+ BEDROCK_MODEL_ID) is set; the advisory Claude review is dormant. No-op."
            fi
          fi

      # Check out the DEFAULT branch, never the untrusted pull request head. This job holds the
      # review credential and write scope, so checking out pull-request code here would let a fork
      # supply a hostile review contract or code. The review reads the change with `gh pr diff` and
      # posts through the API, so it never needs the head. The default branch is the trusted home of
      # the contract, and it resolves on comment events too, whose payload carries no base branch.
      - name: Check out the default branch (trusted) for the review contract
        if: steps.gate.outputs.provider != 'none'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false

      # Collect the findings already posted, so the reviewer can skip them while still reading the
      # full diff. Fetching them here is reliable where `gh pr view --comments` is not (it does not
      # return inline review comments), and it needs no checkout of the pull request head. The pull
      # request number comes from whichever payload carries it: `issue_comment` has `issue.number`,
      # the other two events have `pull_request.number`.
      - name: Compute the review inputs (prior findings)
        id: inputs
        if: steps.gate.outputs.provider != 'none'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
        run: |
          set -euo pipefail
          echo "pr=$PR" >> "$GITHUB_OUTPUT"
          # Each finding already posted inline, compacted to `path:line — first body line`.
          # - Match the author as well as the prefix: anyone who can comment could write the prefix,
          #   and this list reaches the prompt as trusted text. The action posts with GITHUB_TOKEN, so
          #   the reviewer's own comments come from github-actions[bot].
          # - Cap by lines, never by bytes, so a cut cannot split a multi-byte character. Each line
          #   is capped at 300 characters, and `tail` keeps the newest 200 findings (the API returns
          #   the oldest first), which are the ones a new run is most likely to repeat.
          # `printf -v` builds the multi-line value without a heredoc, whose column-0 body would end
          # this YAML block scalar.
          PRIOR=$(gh api --paginate "repos/$REPO/pulls/$PR/comments" \
            --jq '.[] | select(.user.login == "github-actions[bot]") | select(.body | startswith("🤖 **Claude Code**")) | "- " + .path + ":" + ((.line // .original_line // 0)|tostring) + " — " + (.body|split("\n")[0]|.[0:300])' \
            | tail -n 200 || true)
          if [ -n "$PRIOR" ]; then
            printf -v PRIOR_SECTION '%s\n%s' \
              'The following findings are ALREADY posted as inline comments on this pull request. Do NOT repeat, restate, or re-post any of them: match by file, line, and substance, and treat them as settled. You must still raise every OTHER real issue you find anywhere in the diff, even on code an earlier pass overlooked.' \
              "$PRIOR"
          else
            PRIOR_SECTION=""
          fi

          {
            echo "prior_section<<__SESSION_HUB_EOF__"
            printf '%s\n' "$PRIOR_SECTION"
            echo "__SESSION_HUB_EOF__"
          } >> "$GITHUB_OUTPUT"

      - name: Exchange the OIDC token for Bedrock AWS credentials
        if: steps.gate.outputs.provider == 'bedrock'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_BEDROCK_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Run the advisory Claude review
        if: steps.gate.outputs.provider != 'none'
        uses: anthropics/claude-code-action@be7b93b1907a4abad570368f3c74b6fe3807510b  # v1.0.183
        env:
          # Bedrock needs an explicit model id (an inference-profile id, ideally an Opus profile) from
          # the `BEDROCK_MODEL_ID` variable. Empty on the subscription path, where claude_args pins
          # the model instead.
          ANTHROPIC_MODEL: ${{ steps.gate.outputs.provider == 'bedrock' && vars.BEDROCK_MODEL_ID || '' }}
        with:
          # Exactly one provider is active per run: on 'oauth' the token authenticates and use_bedrock
          # is false; on 'bedrock' the token is empty and use_bedrock is true.
          use_bedrock: ${{ steps.gate.outputs.provider == 'bedrock' }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Grant exactly the tools the review needs: the action's native inline-comment tool, and the
          # read-only `gh pr diff` and `gh pr view`. Withholding `gh pr comment` enforces the
          # no-summary rule. The review runs on Opus on the subscription path for sharper severity
          # triage and fewer low-value comments.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr diff:*),Bash(gh pr view:*)"
            ${{ steps.gate.outputs.provider == 'oauth' && '--model opus' || '' }}
          # Every event gets this same prompt, comment events included, so a requested pass is the
          # same review as an automatic one: the contract, its severity floor, its comment prefix, and
          # the prior findings ({1}).
          prompt: ${{ format('Review this pull request (#{0}) as an advisory (non-gating) reviewer. Read the review contract at .github/claude-review-prompt.md and follow it exactly, including its rule to start every inline comment with the Claude Code prefix, since the comments post under github-actions[bot]. Read the diff with `gh pr diff {0}` and review the ENTIRE diff in this single pass. Raise every finding at once, and do NOT treat unchanged code as settled just because an earlier run did not flag it. {1} Post each finding as an inline comment with the mcp__github_inline_comment__create_inline_comment tool, adding a GitHub suggestion block wherever a concrete, mechanical fix fits. Do NOT post any top-level summary comment; post inline findings only. If nothing warrants a comment, post nothing. This review is advisory only, never a merge gate.', steps.inputs.outputs.pr, steps.inputs.outputs.prior_section) }}
