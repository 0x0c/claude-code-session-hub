# Scan the history for secrets. The local hooks (.githooks/) can be bypassed or never enabled; this
# job cannot, so a secret shows up as a red check before the merge.
name: "Secret scan"

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up
        run: make setup

      - name: Scan the history
        run: scripts/check_secrets.sh
